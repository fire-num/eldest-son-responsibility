<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="《长子担当——沈阳装备制造业全国第一的数字化展示设计》可交互原型：机床、国徽、航空、三线建设四大板块，追溯沈阳装备制造业的全国第一。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2315171b'/%3E%3Ctext x='32' y='44' font-size='28' font-weight='900' fill='%23FF6C0A' text-anchor='middle' font-family='Arial'%3ESY%3C/text%3E%3C/svg%3E">
<title>长子担当 · 沈阳装备制造业全国第一 · 数字化展示</title>
<style>
:root{
  --bg:#15171b; --panel:rgba(255,255,255,.055); --panel2:rgba(255,255,255,.09);
  --line:rgba(255,255,255,.15); --line2:rgba(255,255,255,.25);
  --orange:#FF6C0A; --blue:#004A9E; --white:#fff; --grey:#bfbfbf; --dark:#1d1f25;
}
*{margin:0;padding:0;box-sizing:border-box;}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px;border-radius:4px;}
html,body{width:100%;height:100%;background:#0c0d10;overflow:hidden;font-family:"PingFang SC","Microsoft YaHei","微软雅黑",sans-serif;color:var(--white);}
#stage{width:1920px;height:1080px;position:fixed;top:0;left:0;transform-origin:top left;background:var(--bg);}
/* ============ 通用 ============ */
#screen{position:absolute;inset:0;}
.screen{position:absolute;inset:0;display:none;overflow:hidden;}
.screen::after{content:"";position:absolute;inset:0;background:url(images/bg_metal.jpg) center/cover;opacity:.08;pointer-events:none;}
#screen-cover::after{display:none;}
.screen.active{display:block;animation:in .45s ease both;}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;z-index:1;}
.scroll::-webkit-scrollbar{width:6px}
.scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:3px}
.pad{padding:170px 90px 60px;}
.screen:has(.hintbar) .pad{padding-bottom:150px;}
h1.big{font-size:60px;font-weight:800;letter-spacing:2px;}
h2.sub{font-size:24px;color:var(--grey);font-weight:400;margin-top:10px;}
.org{color:var(--orange);}
.blue{color:#5b8dd9;}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 44px;background:var(--orange);color:#fff;font-size:24px;font-weight:700;border-radius:8px;cursor:pointer;border:none;letter-spacing:4px;transition:.25s;box-shadow:0 6px 22px rgba(255,108,10,.35);}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(255,108,10,.5);}
.btn:active{transform:translateY(0) scale(.97);}
.btn.ghost{background:transparent;border:2px solid var(--line2);color:#fff;box-shadow:none;letter-spacing:2px;}
.btn.ghost:hover{border-color:var(--orange);color:var(--orange);}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;transition:.3s;}
.card:hover{background:var(--panel2);border-color:rgba(255,108,10,.6);transform:translateY(-4px);box-shadow:0 12px 32px rgba(0,0,0,.45);}
.tag{display:inline-block;padding:3px 14px;border-radius:20px;font-size:15px;background:rgba(255,108,10,.16);color:var(--orange);border:1px solid rgba(255,108,10,.4);}
.sec-title{font-size:34px;font-weight:800;margin:26px 0 18px;display:flex;align-items:center;gap:14px;}
.sec-title::before{content:"";width:8px;height:30px;background:var(--orange);border-radius:2px;display:inline-block;}
.hintbar{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);background:rgba(20,22,28,.88);border:1px solid var(--line2);color:var(--grey);font-size:16px;padding:9px 26px;border-radius:30px;letter-spacing:2px;z-index:5;backdrop-filter:blur(6px);white-space:nowrap;}
.hintbar b{color:var(--orange);font-weight:600;}
.srcnote{margin-top:34px;padding:14px 20px;font-size:14px;color:#9aa3ad;border-top:1px solid var(--line);line-height:1.8;letter-spacing:.5px;}
/* ============ 顶栏 ============ */
#header{position:absolute;top:0;left:0;right:0;z-index:50;display:none;background:linear-gradient(180deg,rgba(15,17,21,.97),rgba(15,17,21,.88) 72%,rgba(15,17,21,.55));padding:12px 40px 0;}
#header.show{display:block;}
.h-row1{display:flex;align-items:center;gap:14px;}
.h-logo{display:flex;align-items:baseline;cursor:pointer;user-select:none;transition:.2s;}
.h-logo:hover .logo-txt{color:#fff;}
.logo-sy{font-size:56px;font-weight:900;color:var(--orange);letter-spacing:0;line-height:1;}
.logo-no1{font-size:24px;font-weight:800;color:var(--orange);margin-left:-4px;margin-top:18px;}
.logo-txt{font-size:28px;font-weight:800;color:var(--orange);letter-spacing:2px;transition:.2s;}
.h-search{flex:1;display:flex;justify-content:flex-end;align-items:center;gap:8px;}
.h-search input{width:300px;background:rgba(255,255,255,.08);border:1px solid var(--line2);border-radius:6px;color:#fff;font-size:18px;padding:8px 16px;outline:none;transition:.25s;}
.h-search input:focus{border-color:var(--orange);background:rgba(255,255,255,.12);}
.h-search .cn{font-size:16px;color:var(--grey);padding:6px 12px;border:1px solid var(--line2);border-radius:6px;}
.h-clock{font-size:18px;color:#fff;letter-spacing:2px;min-width:110px;text-align:center;font-variant-numeric:tabular-nums;}
.h-row2{display:flex;align-items:center;margin-top:6px;padding-bottom:10px;position:relative;}
.h-back{font-size:22px;color:#fff;padding:6px 20px 6px 8px;cursor:pointer;display:flex;align-items:center;gap:8px;border-right:1px solid var(--line2);margin-right:26px;transition:.2s;user-select:none;}
.h-back:hover{color:var(--orange);}
.h-back.off{opacity:0;pointer-events:none;}
.h-tabs{display:flex;gap:6px;flex:1;justify-content:flex-end;}
.h-tab{font-size:24px;color:#fff;padding:8px 26px;cursor:pointer;border-radius:6px;transition:.2s;position:relative;user-select:none;letter-spacing:2px;}
.h-tab:hover{background:rgba(255,255,255,.08);}
.h-tab.active{color:var(--orange);font-weight:800;font-size:27px;background:rgba(255,108,10,.1);}
.h-tab.active::after{content:"";position:absolute;left:26%;right:26%;bottom:2px;height:3px;background:var(--orange);border-radius:2px;}
.h-crumb{font-size:16px;color:var(--grey);margin-left:20px;white-space:nowrap;}
.h-crumb .cur{color:var(--orange);}
/* 搜索下拉 */
#searchDrop{position:absolute;top:78px;right:40px;width:420px;background:#1d2026;border:1px solid var(--line2);border-radius:10px;display:none;z-index:60;max-height:480px;overflow-y:auto;box-shadow:0 16px 40px rgba(0,0,0,.5);}
#searchDrop .sd-item{padding:12px 18px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:.15s;}
#searchDrop .sd-item:hover{background:rgba(255,108,10,.12);}
#searchDrop .sd-item b{color:var(--orange);font-weight:700;}
#searchDrop .sd-item>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#searchDrop .sd-k{color:var(--grey);font-size:13px;margin-left:14px;flex:0 0 auto;}
/* ============ 封面 ============ */
#screen-cover{background:#000;}
#screen-cover .bgimg{position:absolute;inset:0;background:url(images/cover_museum.jpg) center/cover no-repeat;filter:brightness(.55) saturate(.95);}
#screen-cover .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,10,14,.55),rgba(8,10,14,.35) 40%,rgba(8,10,14,.82));}
#screen-cover .top{position:absolute;top:34px;left:54px;display:flex;align-items:center;gap:12px;z-index:3;}
#screen-cover .top .logo-sy{font-size:52px;}
#screen-cover .top .logo-txt{font-size:26px;}
#screen-cover .top-search{position:absolute;top:44px;right:54px;color:#fff;font-size:20px;z-index:6;display:flex;align-items:center;gap:10px;}
#screen-cover .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:3;padding:0 160px;text-align:center;}
#screen-cover .logoimg{width:780px;margin-bottom:26px;filter:drop-shadow(0 6px 20px rgba(0,0,0,.6));}
#screen-cover .title{font-size:44px;font-weight:900;letter-spacing:14px;color:#3f74c8;text-shadow:0 0 26px rgba(0,74,158,.5),1px 1px 0 #FF6C0A;margin-bottom:18px;}
#screen-cover .intro{font-size:18px;color:#e6e6e6;line-height:2;max-width:1180px;margin-bottom:46px;opacity:.95;}
#screen-cover .start{animation:float 2.6s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
#screen-cover .scrolltip{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);color:#bbb;font-size:15px;letter-spacing:4px;z-index:3;}
/* ============ 首页四大板块 ============ */
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:24px;}
.home-card{position:relative;padding:36px 42px;cursor:pointer;overflow:hidden;min-height:280px;}
.home-card .no{position:absolute;right:26px;top:8px;font-size:104px;font-weight:900;color:rgba(255,255,255,.05);font-style:italic;}
.home-card .ic{width:56px;height:56px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;margin-bottom:14px;background:rgba(255,108,10,.14);color:var(--orange);border:1px solid rgba(255,108,10,.35);}
.home-card:nth-child(2) .ic{background:rgba(0,74,158,.3);color:#6ea4e8;border-color:rgba(0,74,158,.7);}
.home-card:nth-child(3) .ic{background:rgba(255,255,255,.08);color:#dfe6f0;border-color:var(--line2);}
.home-card:nth-child(4) .ic{background:rgba(120,190,120,.14);color:#8fce8f;border-color:rgba(120,190,120,.4);}
.home-card h3{font-size:32px;font-weight:800;letter-spacing:3px;}
.home-card p{font-size:16px;color:var(--grey);line-height:1.7;margin-top:8px;}
.home-card .more{margin-top:16px;font-size:16px;color:var(--orange);letter-spacing:2px;}
.home-hero{margin-top:24px;padding:18px 44px;display:flex;align-items:center;gap:30px;background:linear-gradient(90deg,rgba(0,74,158,.25),transparent);border:1px solid rgba(0,74,158,.5);border-radius:12px;}
.home-hero .nums{display:flex;gap:40px;flex:1;}
.home-hero .num b{font-size:32px;color:var(--orange);display:block;}
.home-hero .num span{font-size:14px;color:var(--grey);}
/* ============ 机床之乡 ============ */
.jc-hero{display:flex;gap:44px;align-items:stretch;margin-top:30px;}
.jc-hero .ph{flex:0 0 640px;border-radius:12px;overflow:hidden;position:relative;border:1px solid var(--line);}
.jc-hero .ph img{width:100%;height:100%;object-fit:cover;filter:saturate(.9);}
.jc-hero .ph .ph-tag{position:absolute;left:0;bottom:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.75));padding:30px 24px 16px;font-size:16px;color:#eee;}
.jc-miles{flex:1;display:flex;flex-direction:column;gap:12px;}
.jc-mile{display:flex;gap:16px;align-items:flex-start;padding:13px 18px;background:var(--panel);border:1px solid var(--line);border-radius:10px;transition:.25s;cursor:pointer;}
.jc-mile:hover{border-color:var(--orange);background:var(--panel2);}
.jc-mile .yr{font-size:20px;font-weight:800;color:var(--orange);min-width:74px;}
.jc-mile .tx{font-size:15.5px;color:#ddd;line-height:1.65;}
.jc-mile .tx b{color:#fff;}
.jc-foot{margin-top:36px;text-align:center;}
/* ============ 万械之基画廊 ============ */
.gal-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:26px;}
.gal-axis{display:flex;align-items:center;gap:0;margin:8px 0 26px;}
.gal-axis .ax{flex:1;height:3px;background:linear-gradient(90deg,var(--blue),var(--orange));position:relative;}
.gal-axis .ax::before{content:"";position:absolute;left:0;top:-5px;width:13px;height:13px;border-radius:50%;background:var(--blue);}
.gal-axis .ax::after{content:"";position:absolute;right:0;top:-5px;width:13px;height:13px;border-radius:50%;background:var(--orange);box-shadow:0 0 12px rgba(255,108,10,.8);}
.gal-axis .a-label{font-size:15px;color:var(--grey);padding:0 14px;white-space:nowrap;}
.gal-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:22px;}
.gal-card{cursor:pointer;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:10px;transition:.3s;}
.gal-card:hover{transform:translateY(-6px);border-color:var(--orange);box-shadow:0 14px 34px rgba(0,0,0,.5);}
.gal-card .gimg{height:180px;overflow:hidden;position:relative;background:#111;}
.gal-card .gimg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(10,12,16,.55));pointer-events:none;}
.gal-card .gimg img{width:100%;height:100%;object-fit:cover;transition:.5s;}
.gal-card:hover .gimg img{transform:scale(1.08);}
.gal-card .gimg .gyr{position:absolute;left:0;top:0;background:var(--orange);color:#fff;font-size:17px;font-weight:800;padding:6px 16px;border-bottom-right-radius:10px;z-index:1;}
.gal-card .gtx{padding:14px 16px;}
.gal-card .gtx b{font-size:18px;letter-spacing:1px;}
.gal-card .gtx span{display:block;font-size:14px;color:var(--grey);margin-top:5px;}
/* ============ 详情页 ============ */
.detail{display:flex;gap:50px;align-items:flex-start;}
.detail .dimg{flex:0 0 680px;border-radius:12px;overflow:hidden;border:1px solid var(--line);position:sticky;top:20px;background:#0f1115;}
.detail .dimg img{width:100%;display:block;}
.m-nav{display:flex;align-items:center;justify-content:space-between;margin-top:16px;gap:12px;}
.m-nav .mn-btn{flex:1;text-align:center;padding:10px 0;border:1px solid var(--line2);border-radius:8px;color:#fff;font-size:17px;letter-spacing:2px;cursor:pointer;transition:.2s;background:rgba(255,255,255,.04);user-select:none;}
.m-nav .mn-btn:hover{border-color:var(--orange);color:var(--orange);background:rgba(255,108,10,.1);}
.m-nav .mn-info{flex:0 0 auto;padding:0 10px;font-size:15px;color:var(--grey);white-space:nowrap;}
.detail .dinfo{flex:1;}
.detail .dinfo .dtitle{font-size:44px;font-weight:900;letter-spacing:2px;}
.detail .dinfo .dsub{font-size:22px;color:var(--orange);margin-top:6px;font-weight:700;}
.kv{display:grid;grid-template-columns:110px 1fr;gap:10px 18px;margin:26px 0;padding:20px 24px;background:var(--panel);border:1px solid var(--line);border-radius:10px;}
.kv .k{color:var(--orange);font-weight:700;font-size:17px;}
.kv .v{color:#eee;font-size:17px;line-height:1.7;}
.para{font-size:17px;color:#e2e2e2;line-height:2.05;}
.para.mt{margin-top:22px;}
/* ============ 战机谱系 ============ */
.fg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-top:34px;}
.fg-card{position:relative;cursor:pointer;overflow:hidden;border-radius:12px;background:var(--panel);border:1px solid var(--line);min-height:360px;transition:.3s;}
.fg-card:hover{border-color:var(--orange);transform:translateY(-6px);box-shadow:0 16px 40px rgba(0,0,0,.5);}
.fg-card .fimg{height:250px;overflow:hidden;background:#0f1115;position:relative;}
.fg-card .fimg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 42%,rgba(10,12,16,.58));pointer-events:none;}
.fg-card .fimg img{width:100%;height:100%;object-fit:cover;transition:.5s;}
.fg-card:hover .fimg img{transform:scale(1.07);}
.fg-card .fbody{padding:18px 22px 22px;}
.fg-card .fbody .ft{font-size:21px;font-weight:800;letter-spacing:1px;}
.fg-card .fbody .fn{margin-top:6px;font-size:15px;color:var(--orange);}
.fg-card .fbody .fe{font-size:14px;color:var(--grey);margin-top:4px;padding-right:108px;line-height:1.6;}
.fg-card .fbody .fgo{position:absolute;right:18px;bottom:18px;font-size:14px;color:var(--grey);letter-spacing:2px;transition:.2s;}
.fg-card:hover .fgo{color:var(--orange);}
/* 战斗机详情tabs */
.ftabs{display:flex;gap:4px;margin:26px 0 8px;border-bottom:2px solid var(--line);}
.ftab{padding:12px 34px;font-size:20px;color:var(--grey);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:.2s;letter-spacing:2px;}
.ftab:hover{color:#fff;}
.ftab.active{color:var(--orange);border-bottom-color:var(--orange);font-weight:800;}
.fcontent{min-height:300px;padding:10px 0;}
.fcontent .f-row{display:flex;gap:34px;align-items:flex-start;}
.fcontent .f-row .f-photo{flex:0 0 460px;border-radius:10px;overflow:hidden;border:1px solid var(--line);}
.fcontent .f-row .f-photo img{width:100%;display:block;}
.fcontent .f-row .f-photo.zoom img{transform:scale(1.9);transform-origin:center;}
.fcontent .f-row .f-txt{flex:1;}
.engine-note{margin-top:18px;padding:16px 22px;background:rgba(0,74,158,.12);border:1px solid rgba(0,74,158,.5);border-radius:10px;font-size:16px;color:#cdd9ec;}
.engine-note img{width:74%!important;display:block;margin:14px auto 0;border-radius:8px;}
.engine-spec{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px;}
.engine-spec .es{background:rgba(255,255,255,.05);border:1px solid var(--line2);border-radius:8px;padding:10px 12px;text-align:center;}
.engine-spec .es .k{font-size:13px;color:var(--grey);}
.engine-spec .es .v{font-size:17px;font-weight:800;color:#fff;margin-top:4px;}
.spec-table{width:100%;border-collapse:collapse;margin-top:16px;font-size:15px;}
.spec-table td{border:1px solid var(--line2);padding:9px 12px;color:#cdd9ec;}
.spec-table td:first-child{color:var(--grey);width:110px;background:rgba(255,255,255,.03);font-weight:600;}
.chart-title{font-size:16px;font-weight:700;color:#fff;margin:26px 0 4px;display:flex;align-items:center;gap:8px;}
.chart-title::before{content:"";width:4px;height:18px;background:var(--orange);border-radius:2px;}
.chart-sub{font-size:13px;color:var(--grey);margin-bottom:10px;}
.radar-wrap{background:rgba(255,255,255,.04);border:1px solid var(--line2);border-radius:10px;padding:14px;display:flex;justify-content:center;}
.radar-wrap svg{width:100%;max-width:620px;height:auto;}
.bar-wrap{background:rgba(255,255,255,.04);border:1px solid var(--line2);border-radius:10px;padding:16px 18px;}
.bar-wrap svg{width:100%;height:auto;display:block;}
/* ===== V5：相关信息（Web71 布局）+ 战机左右切换 ===== */
.f-info{display:flex;gap:42px;align-items:flex-start;}
.f-info .f-photo{flex:0 0 470px;border-radius:10px;overflow:hidden;border:1px solid var(--line);}
.f-info .f-photo img{width:100%;display:block;}
.f-info .f-photo.zoom img{transform:scale(1.9);transform-origin:center;}
.f-info .f-cap{font-size:24px;font-weight:800;color:#fff;text-align:center;padding:14px 10px 8px;background:rgba(0,0,0,.25);letter-spacing:2px;}
.f-info .f-txt{flex:1;min-width:0;}
.f-info .f-paras .para{margin-bottom:16px;}
.f-info .f-paras .para+.para{padding-top:14px;border-top:1px dashed rgba(205,217,236,.14);}
.f-param{width:100%;}
.f-param .para{max-width:960px;}
.f-arrow{position:fixed;top:50%;transform:translateY(-50%);width:52px;height:92px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;color:#9fc1ef;background:rgba(0,74,158,.22);border:1px solid rgba(0,74,158,.45);border-radius:10px;cursor:pointer;z-index:60;transition:.18s;user-select:none;backdrop-filter:blur(2px);}
.f-arrow:hover{background:rgba(0,74,158,.6);color:#fff;border-color:#ff8c33;}
.f-arrow-l{left:12px;}
.f-arrow-r{right:12px;}
.f-switch{display:flex;align-items:center;justify-content:center;gap:20px;margin-top:26px;color:var(--grey);font-size:14px;}
.f-switch .btn{padding:9px 22px;font-size:15px;}
.f-switch .cnt{letter-spacing:1px;}
.dsub{font-size:15px;color:var(--orange);font-weight:600;letter-spacing:1px;}
/* ============ 英雄 ============ */
.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:34px;}
.hero-card{display:flex;gap:26px;padding:26px;cursor:pointer;align-items:center;}
.hero-card .hp{width:150px;height:190px;border-radius:10px;overflow:hidden;flex:0 0 auto;border:1px solid var(--line);}
.hero-card .hp img{width:100%;height:100%;object-fit:cover;}
.hero-card .hb h3{font-size:28px;font-weight:800;}
.hero-card .hb .rt{color:var(--orange);font-size:16px;margin-top:6px;}
.hero-card .hb .rc{color:var(--grey);font-size:14px;margin-top:4px;}
.hero-card .hb .go{margin-top:12px;font-size:15px;color:#fff;letter-spacing:2px;}
/* ============ 地图/研究所 ============ */
.map-wrap{display:flex;gap:40px;margin-top:26px;}
.map-net{flex:0 0 640px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:26px;position:relative;}
.map-net svg{width:100%;height:auto;}
.map-region{fill:rgba(255,108,10,.16);stroke:#FF6C0A;stroke-width:1.4;cursor:pointer;transition:.2s;}
.map-region:hover,.map-region.active{fill:rgba(255,108,10,.42);}
.map-region-label{font-size:17px;fill:#fff;cursor:pointer;font-weight:700;}
.map-region-label:hover{fill:var(--orange);}
.map-list{flex:1;}
.ins-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:16px;}
.ins-card{padding:20px 22px;cursor:pointer;}
.ins-card .in-city{font-size:26px;font-weight:800;color:var(--orange);}
.ins-card .in-name{font-size:17px;color:#fff;margin-top:4px;font-weight:700;line-height:1.5;}
.ins-card .in-code{font-size:13px;color:var(--grey);margin-top:6px;}
.ins-card .in-brief{font-size:14px;color:#c6c6c6;line-height:1.7;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
/* ============ 三线建设 ============ */
.sx-stats{display:grid;grid-template-columns:repeat(6,1fr);gap:18px;margin:30px 0;}
.sx-stat{text-align:center;padding:22px 10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;}
.sx-stat b{font-size:36px;color:var(--orange);display:block;}
.sx-stat span{font-size:14px;color:var(--grey);margin-top:6px;display:block;}
/* ============ 实战战绩 ============ */
.battle-list{margin-top:26px;display:flex;flex-direction:column;gap:16px;}
.battle-item{padding:20px 26px;border-left:4px solid var(--orange);background:var(--panel);border-radius:0 10px 10px 0;font-size:16.5px;color:#e4e4e4;line-height:1.9;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);}
/* ============ 原型导航侧栏 ============ */
.float-btn{position:absolute;right:26px;bottom:26px;z-index:80;display:flex;flex-direction:column;gap:10px;}
.float-btn .fb{width:54px;height:54px;border-radius:50%;background:rgba(30,33,40,.92);border:1px solid var(--line2);color:#fff;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:.2s;backdrop-filter:blur(6px);box-shadow:0 8px 24px rgba(0,0,0,.4);}
.float-btn .fb:hover{background:var(--orange);border-color:var(--orange);transform:translateY(-3px);}
#iaPanel{position:absolute;right:0;top:0;bottom:0;width:520px;background:#171a20;border-left:1px solid var(--line2);z-index:90;transform:translateX(100%);transition:.35s;padding:36px 34px;overflow-y:auto;box-shadow:-20px 0 60px rgba(0,0,0,.5);}
#iaPanel.open{transform:none;}
#iaPanel h3{font-size:26px;font-weight:800;letter-spacing:2px;margin-bottom:6px;}
#iaPanel .sub{color:var(--grey);font-size:14px;margin-bottom:22px;line-height:1.8;}
.ia-tree{margin-top:8px;}
.ia-node{border-left:2px solid var(--line2);margin-left:14px;padding-left:18px;padding-bottom:12px;position:relative;}
.ia-node::before{content:"";position:absolute;left:-5px;top:8px;width:8px;height:8px;border-radius:50%;background:var(--orange);}
.ia-node .n{font-size:16px;color:#fff;font-weight:700;}
.ia-node .c{font-size:14px;color:var(--grey);margin-top:4px;line-height:1.8;}
.ia-note{margin-top:22px;padding:16px 18px;background:rgba(255,108,10,.08);border:1px solid rgba(255,108,10,.3);border-radius:10px;font-size:14px;color:#e8c9a8;line-height:1.9;}
/* 过渡/工具 */
.fade-msg{position:absolute;left:50%;top:40%;transform:translateX(-50%);background:rgba(20,22,28,.95);padding:14px 40px;border-radius:40px;border:1px solid var(--orange);color:#fff;font-size:20px;letter-spacing:3px;z-index:70;display:none;animation:in .3s;}
/* ============================================================
   V6 冲奖升级 · 视觉母题 + 动效叙事（叠加增强，不改原有排版）
   ============================================================ */
:root{--blueprint:#2a6bb8;--steel:#8fa5bd;}
/* —— 蓝图工程网格母题（叠加于金属肌理之上）—— */
.screen::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(42,107,184,.11) 1px,transparent 1px),
    linear-gradient(90deg,rgba(42,107,184,.11) 1px,transparent 1px),
    linear-gradient(rgba(42,107,184,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(42,107,184,.05) 1px,transparent 1px);
  background-size:130px 130px,130px 130px,26px 26px,26px 26px;
  -webkit-mask-image:radial-gradient(ellipse at center,#000 55%,transparent 100%);
          mask-image:radial-gradient(ellipse at center,#000 55%,transparent 100%);}
#screen-cover::before{display:none;}
/* —— 四角工程定位标记 —— */
#regmarks{position:absolute;inset:0;pointer-events:none;z-index:45;}
#regmarks i{position:absolute;width:20px;height:20px;}
#regmarks i::before,#regmarks i::after{content:"";position:absolute;background:rgba(255,140,51,.55);}
#regmarks i::before{left:50%;top:0;width:1.5px;height:100%;transform:translateX(-50%);}
#regmarks i::after{top:50%;left:0;height:1.5px;width:100%;transform:translateY(-50%);}
#regmarks .tl{left:14px;top:14px;} #regmarks .tr{right:14px;top:14px;}
#regmarks .bl{left:14px;bottom:14px;} #regmarks .br{right:14px;bottom:14px;}
/* —— 页面转场升级 —— */
.screen.active{animation:screenIn .6s cubic-bezier(.22,.8,.3,1) both;}
@keyframes screenIn{from{opacity:0;transform:translateY(20px) scale(.994);filter:blur(5px)}
  to{opacity:1;transform:none;filter:blur(0)}}
/* —— 开场 preloader —— */
#preloader{position:fixed;inset:0;z-index:200;background:#0c0d10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;}
#preloader .gear{width:96px;height:96px;animation:spin 3.2s linear infinite;}
#preloader .pl-title{font-size:26px;font-weight:800;letter-spacing:10px;color:#fff;}
#preloader .pl-sub{font-size:13px;letter-spacing:5px;color:var(--orange);margin-top:-16px;}
#preloader .pl-bar{width:300px;height:3px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden;}
#preloader .pl-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--orange));}
#preloader .pl-skip{position:absolute;right:34px;bottom:26px;font-size:13px;color:#7a828d;letter-spacing:2px;cursor:pointer;}
#preloader .pl-skip:hover{color:var(--orange);}
@keyframes spin{to{transform:rotate(360deg)}}
/* —— 封面标题入场（preloader 结束后触发）—— */
#screen-cover .logoimg{opacity:0;}
#screen-cover .title{opacity:0;}
#screen-cover .intro{opacity:0;}
#screen-cover .start{opacity:0;}
#screen-cover.go .logoimg{animation:fadeUp .9s .05s ease both;}
#screen-cover.go .title{animation:fadeUp .9s .3s ease both;}
#screen-cover.go .intro{animation:fadeUp 1s .55s ease both;}
#screen-cover.go .start{animation:fadeUp .8s .8s ease both;}
#screen-cover.go .start.float{animation:fadeUp .8s .8s ease both,float 2.6s 1.7s ease-in-out infinite;}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
/* 封面标题扫描光 */
#screen-cover.go .title{position:relative;overflow:hidden;}
#screen-cover.go .title::after{content:"";position:absolute;top:0;bottom:0;width:38%;left:-40%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);
  animation:titleSweep 1.6s 1s ease;}
@keyframes titleSweep{to{left:140%;}}
/* —— 滚动揭示 —— */
.rv{opacity:0;transform:translateY(28px);transition:opacity .7s ease,transform .7s ease;}
.rv.in{opacity:1;transform:none;}
/* —— 卡片光扫 —— */
.home-card{position:relative;}
.home-card .sweep{position:absolute;top:-20%;bottom:-20%;width:42%;left:-60%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.07),transparent);
  transform:skewX(-16deg);pointer-events:none;}
.home-card:hover .sweep{animation:sweepGo .95s ease;}
@keyframes sweepGo{to{left:135%;}}
/* —— 数据动效：雷达描边 / 条形增长 —— */
.radar-wrap polygon.data-poly{stroke-dasharray:900;stroke-dashoffset:900;fill-opacity:0;}
.radar-wrap.go polygon.data-poly{animation:drawLine 1.5s .2s ease forwards,fillIn .8s 1.3s ease forwards;}
@keyframes drawLine{to{stroke-dashoffset:0}}
@keyframes fillIn{to{fill-opacity:.55}}
.bar-wrap rect.bar-fill{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);}
.bar-wrap.go rect.bar-fill{animation:barGrow 1.1s cubic-bezier(.22,.9,.3,1) both;}
@keyframes barGrow{to{transform:scaleX(1)}}
/* —— 语言切换按钮 —— */
.h-search .cn{cursor:pointer;user-select:none;transition:.2s;}
.h-search .cn:hover{border-color:var(--orange);color:var(--orange);}
/* —— reduced motion 无障碍 —— */
@media (prefers-reduced-motion:reduce){
  #preloader{display:none!important;}
  .screen.active,#screen-cover .logoimg,#screen-cover .title,#screen-cover .intro,#screen-cover .start{animation:none!important;opacity:1!important;}
  .rv{opacity:1!important;transform:none!important;transition:none!important;}
  .radar-wrap polygon.data-poly{stroke-dasharray:none!important;stroke-dashoffset:0!important;fill-opacity:.55!important;}
  .bar-wrap rect.bar-fill{transform:none!important;}
  #preloader .gear,#screen-cover.go .title::after{animation:none!important;}
}
</style>

  {id:"m1949",nameEn:"The First Lathe",subEn:"6-Foot Belt-Driven Lathe",factoryEn:"Shenyang No.1 Machine Tool Works",sigEn:"When New China was founded, China's machine tool industry was a blank sheet, and the manufacturing parameters were tightly held abroad. China's first six-foot belt-driven lathe was built in 1949 by Shenyang Machinery Factory, predecessor of Shenyang No.1 Machine Tool Works. Compared with foreign industrial technology, this lathe had a simple structure and could not be applied at scale; yet as a miracle made by the Chinese themselves it was a sound beginning for industrial development. These lathes were sold across the country, becoming the mother machines of industrial production and creating many production miracles.",year:"1949",name:"第一台车床",sub:"6尺皮带车床",factory:"沈阳第一机床厂",img:"m_1949_chechuang.jpg",time:"1949年4月",sig:"新中国成立的时候，中国机床是一片空白，苏联唯恐中国发展赶超，将制造机床的参数紧紧攥在自己手里。我国第一台六尺皮带车床是沈阳机械厂（沈一机前身）在1949年制造出来，对比国外的工业技术，这台车床结构简单无法大规模应用，但作为中国人自己制造的奇迹是工业发展一个良好的开端。这些车床被销售到全国各地，成为工业生产的母机，并创造出许多生产奇迹。"},
  {id:"m1950",nameEn:"The First Radial Drill Press",subEn:"Radial Drill Press",factoryEn:"Zhongjie Friendship Factory",sigEn:"The radial drill is a branch of the drill press family. Its arm can rotate 360 degrees around the column and move up and down; the spindle box and gearbox are integrated and can move horizontally along the arm. It is also called the cross-arm drill. On a vertical drill the cutting tool is fixed, and centering with the workpiece must be achieved by moving the workpiece, clearly inconvenient for large, heavy workpieces. The radial drill can center by moving the tool spindle position, bringing great convenience for drilling holes on large, heavy workpieces in single-piece and small-batch production.",year:"1950",name:"第一台摇臂钻床",sub:"摇臂钻床",factory:"中捷友谊厂",img:"m_1950_yaobizuan.jpg",time:"1950年",sig:"摇臂钻是钻床家族里面的一个分支。它的摇臂可以围绕立柱360度上下升降，主轴箱和齿轮箱位于一体可以在摇臂上水平移动，它也被称作为横臂钻。在立式钻床上加工孔时，它的刀具是固定无法移动的，与工件的对中必须通过移动工件来实现，对一些大而重的工件显然是非常不方便的；而摇臂钻床能用移动刀具轴的位置来对中，这就给在单件及小批生产中，加工大而重工件上的孔带来了很大的方便。"},
  {id:"m1953",nameEn:"The First Engine Lathe",subEn:"C620-1",factoryEn:"Shenyang No.1 Machine Tool Works",sigEn:"This was the first engine lathe produced by the Chinese themselves, resolving the urgent needs of China's industrial construction in the early days of New China and making an outstanding contribution to the nation's industry. It was therefore printed on the 1960 edition 2-yuan banknote, becoming an eternal classic across time.",year:"1953",name:"第一台普通车床",sub:"C620-1",factory:"沈阳第一机床厂",img:"m_1953_putong.jpg",time:"1953年至1955年",sig:"这是中国人自己生产制造的第一台普通车床，化解了新中国成立初期我国工业建设的燃眉之急，为新中国工业作出了杰出贡献，因此它被印在了1960年版2元人民币上，成为穿越时空的永恒经典。"},
  {id:"m1956",nameEn:"The First Horizontal Boring and Milling Machine",subEn:"Horizontal Boring and Milling Machine",factoryEn:"Shenyang No.1 Machine Tool Works",sigEn:"China's first horizontal boring and milling machine: in 1956, Shenyang No.1 Machine Tool Works successfully developed New China's first horizontal boring and milling machine. Material from the Home of Machine Tools milestones; details are subject to the exhibition.",year:"1956",name:"第一台卧式铣镗床",sub:"卧式铣镗床",factory:"沈阳第一机床厂",img:"m_1956_woxi.jpg",time:"1956年",sig:"中国第一台卧式铣镗床：1956年，沈阳第一机床厂研制成功新中国第一台卧式铣镗床。（素材取自「机床之乡」里程碑，详细说明以展览展陈为准）"},
  {id:"m1964",nameEn:"The First Semi-Automatic Camshaft Lathe",subEn:"CT8305",factoryEn:"Shenyang No.1 Machine Tool Works",sigEn:"China's first semi-automatic camshaft lathe: in 1964, Shenyang No.1 Machine Tool Works independently developed the semi-automatic camshaft lathe CT8305. Details are subject to the exhibition.",year:"1964",name:"第一台半自动凸轮轴车床",sub:"CT8305",factory:"沈阳第一机床厂",img:"m_1964_tulunzhou.jpg",time:"1964年",sig:"中国第一台半自动凸轮轴车床：1964年，沈阳第一机床厂自行研制成功半自动凸轮轴车床CT8305。（详细说明以展览展陈为准）"},
  {id:"m1965",nameEn:"The First Pipe Joint Boring Machine",subEn:"Q1545",factoryEn:"Shenyang No.1 Machine Tool Works",sigEn:"China's first pipe joint boring machine: in 1965, Shenyang No.1 Machine Tool Works independently developed the pipe joint boring machine Q1545. Details are subject to the exhibition.",year:"1965",name:"第一台管接头镗孔机床",sub:"Q1545",factory:"沈阳第一机床厂",img:"m_1965_guantou.jpg",time:"1965年",sig:"中国第一台管接头镗孔机床：1965年，沈阳第一机床厂自行研制成功管接头镗孔机床Q1545。（详细说明以展览展陈为准）"},
  {id:"m1972",nameEn:"The First CA6140",subEn:"CA6140 Engine Lathe",factoryEn:"Shenyang No.1 Machine Tool Works",sigEn:"The development of the CA6140 lathe drove innovation and progress in China's machine tool technology, laying the foundation for later, more advanced CNC machine tools. The CA6140 was also widely used in education and scientific research, providing an important tool for training professionals in machinery manufacturing and for conducting research. Its successful development marked China's independent technological breakthrough in machine tool manufacturing and reduced dependence on foreign technology.",year:"1972",name:"第一台CA6140",sub:"CA6140 卧式车床",factory:"沈阳第一机床厂",img:"m_1972_ca6140.jpg",time:"1972年",sig:"CA6140车床的研制推动了中国机床技术的创新和发展，为后续更高级数控机床的研制奠定了基础。CA6140车床也被广泛应用于教育和科研领域，为培养机械制造领域的专业人才和进行科学研究提供了重要工具。CA6140的成功研制标志着中国在机床制造领域实现了自主技术突破，减少了对外国技术的依赖。"},
  {id:"m1973",nameEn:"The First CNC Lathe",subEn:"CSK6163",factoryEn:"Shenyang No.1 Machine Tool Works",sigEn:"The CSK6163 CNC lathe uses digital control technology to perform precise turning of metal and other hard materials through programming. During its development and use, a large number of technical personnel were trained, providing human resources for the growth of China's machine tool industry. It also marked China's entry into the CNC era.",year:"1973",name:"第一台数控车床",sub:"CSK6163",factory:"沈阳第一机床厂",img:"m_1973_shukong.jpg",time:"1973年",sig:"CSK6163数控车床利用数字化控制技术，通过编程实现对金属或其他硬质材料进行精确的车削加工。在CSK6163车床的研制和使用过程中，培养了一大批技术人才，为中国机床行业的发展提供了人力资源。同时也标志着中国机床进入了数控时代。"},
  {id:"m1989",nameEn:"The First Flexible Machining Cell",subEn:"Flexible Machining Cell",factoryEn:"Shenyang No.1 Machine Tool Works (technology introduced from Heidemann, Germany)",sigEn:"The successful development of China's first flexible machining cell marked an important technological breakthrough in high-end CNC machine tools, reduced dependence on foreign technology and strengthened the independent innovation capacity of domestic industry. It improved manufacturing's response speed and flexibility to market changes, adapting quickly to product changes and demand, especially suited to multi-variety, small- and medium-batch production. Its introduction pushed China's manufacturing to transform and upgrade from traditional to intelligent manufacturing, laying groundwork for Industry 4.0.",year:"1989",name:"第一台柔性加工单元",sub:"柔性加工单元",factory:"沈阳第一机床厂（引进德国海德曼公司技术）",img:"m_1989_rouxing.jpg",time:"1989年",sig:"中国第一台柔性加工单元的研制成功，标志着中国在高端数控机床领域取得了重要的技术突破，减少了对外国技术的依赖，增强了国内工业的自主创新能力。柔性加工单元提高了制造业对市场变化的响应速度和灵活性，能够快速适应产品变化和市场需求，特别适合多品种、中小批量生产。柔性加工单元的引入推动了中国制造业从传统制造向智能制造的转型升级，为实现工业4.0奠定了基础。"},
  {id:"m2001",nameEn:"The First Five-Axis Turn-Mill Machining Center",subEn:"Five-Axis Turn-Mill Machining Center",factoryEn:"Shenyang No.1 Machine Tool Works",sigEn:"China's first five-axis turn-mill machining center: in 2001, Shenyang No.1 Machine Tool Works successfully developed China's first five-axis turn-mill machining center. Details are subject to the exhibition.",year:"2001",name:"第一台五轴车铣加工中心",sub:"五轴车铣加工中心",factory:"沈阳第一机床厂",img:"m_2001_wuzhou.jpg",time:"2001年",sig:"中国第一台五轴车铣加工中心：2001年，沈阳第一机床厂研制成功中国第一台五轴车铣加工中心。（详细说明以展览现场为准）"}

  {id:"j5",capEn:"J-5 maiden flight · July 19, 1956 · Shenyang",titleEn:"China's First Jet Fighter",tagEn:"China's First Domestically Built Jet Fighter",enNoteEn:"New China's first turbojet engine · Shenyang Liming Engine Manufacturing Corporation",infoPartsEn:["Background: After the founding of New China, facing the real threat of the U.S. Air Force during the Korean War, China began work on licensed production of jet fighters. In 1951 the Ministry of Heavy Industry set up the Aviation Industry Bureau to take unified charge of aircraft maintenance. In 1953 the Aviation Industry Administration drew up the overall design assignment for expanding state-owned Shenyang Factory 112 (now AVIC Shenyang Aircraft Corporation, SAC) into a MiG-15 jet fighter factory.","On July 19, 1956, China's first domestically built jet fighter, the J-5, made its maiden flight in Shenyang. It meant New China now possessed an eagle to defend its airspace; the Chinese Air Force opened a new chapter, marking China's entry into the jet age and becoming one of the countries able to mass-produce jet fighters.","The J-5 is China's first high-subsonic jet fighter, with a single seat, single engine, nose intake and swept mid-wing layout and an all-metal structure — compact, light, with good low-altitude maneuverability. It was fitted with the WP-5 engine, with good maneuverability, firepower and survivability.","Structural points: wing sweep 45 degrees, twin-spar structure; all-metal semi-monocoque construction; compact, light, with good low-altitude maneuverability."],paramsEn:"High-subsonic jet fighter · single seat, single engine, nose intake, swept mid-wing · wing sweep 45 degrees, twin-spar structure · all-metal semi-monocoque construction · compact, light, good low-altitude maneuverability · fitted with the WP-5 engine, with good maneuverability, firepower and survivability.",meaningEn:"The successful maiden flight of the J-5 meant New China now possessed an eagle to defend its airspace, marking China's entry into the jet age and becoming one of the world's countries able to mass-produce jet fighters. The J-5 repeatedly won merit in homeland air defense — see the combat records tab.",title:"第一架 喷气式 战机",name:"歼-5",engine:"涡喷-5",en:"涡喷-5",enNote:"新中国第一种涡轮喷气发动机 · 沈阳黎明发动机制造公司",img:"fighter_j5.jpg",engineImg:"engine_wp5.jpg",tag:"中国第一架国产喷气式歼击机",

  {id:"j6",capEn:"J-6 formation · the mainstay fighter of the 1960s–1970s",titleEn:"The First Supersonic Fighter",tagEn:"Taking the Chinese Air Force from Subsonic to Supersonic",enNoteEn:"China's first supersonic aero engine · Shenyang Liming Engine Manufacturing Corporation",infoPartsEn:["The J-6 is an air-superiority fighter China licensed and developed from the Soviet MiG-19, marking the Chinese Air Force's transition from the subsonic to the supersonic age. In the 1950s the MiG-15 was the Chinese Air Force's mainstay; with the advent of supersonic fighters its performance was falling behind, so China sought a new generation of aircraft.","The coming of the supersonic age: in 1953 the U.S. Air Force YF-100 broke the sound barrier on its first flight. In 1954 the SM-9/1 prototype of the Soviet Union's first supersonic fighter, the MiG-19, made its maiden flight, marking the entry of fighters into the supersonic age.","China's needs: in the 1950s the Chinese Air Force's mainstay was the MiG-15 replaced after the Korean War. With the supersonic age dawning, subsonic fighters were clearly outclassed. To keep pace with new trends, the Chinese military closely followed Soviet fighter development and sought technology transfer.","The J-6 was the mainstay of the PLA Air Force from the 1960s through the 1970s and the most numerous type produced by China's aviation industry, with over 4,500 built — far exceeding the number of MiG-19s in the Soviet Union. It was also exported to many countries."],paramsEn:"Supersonic air-superiority fighter · two WP-6 engines (China's first supersonic aero engine) · nose intake, highly swept wings · maximum speed about Mach 1.35 · mainstay of the Chinese Air Force from the 1960s through the 1970s. Performance data per public records.",meaningEn:"The J-6 was the PLA Air Force's mainstay from the 1960s through the 1970s and the most numerous type produced by China's aviation industry, with over 4,500 built, far exceeding its Soviet prototype the MiG-19; it was also exported to many countries, marking the Chinese Air Force's transition from the subsonic to the supersonic age.",title:"第一代 超音速 战机",name:"歼-6",engine:"涡喷-6",en:"涡喷-6",enNote:"中国首型超音速航空发动机 · 沈阳黎明发动机制造公司",img:"fighter_j6.jpg",engineImg:"engine_wp6.jpg",tag:"中国空军从亚音速进入超音速时代",

   info:"歼-6战斗机是中国根据前苏联米格-19仿制和发展的制空战斗机，标志着中国空军从亚音速时代进入超音速时代。超音速时代的到来：1953年，美国空军YF-100在首次试飞中成功突破音障；1954年，苏联第一代超音速战斗机米格-19的SM-9/1原型机首飞成功，标志着战斗机进入了超音速时代。中国空军的需求：20世纪50年代的中国空军主力是朝鲜战争后期换装的米格-15，随着超音速时代的到来，亚音速战斗机的性能已明显落后。为了跟踪新的战机发展趋势，中国军方一直关注苏联的战机发展并寻求技术引进。",

   meaning:"歼-6是中国人民解放军空军于1960至1970年代的主力，也是中国航空工业生产装备数量最多的机型，共生产了逾4500架，远超过其原型苏联米格-19的数量，该机同时出口到了许多国家，标志着中国空军从亚音速时代进入超音速时代。"},
  {id:"j8",capEn:"J-8II high-altitude, high-speed fighter · Shenyang",titleEn:"The First High-Altitude, High-Speed Fighter",tagEn:"The First Independently Designed Engine Successfully Fielded in Numbers",enNoteEn:"The first aero engine independently designed and successfully fielded in numbers · jointly developed by Shenyang Liming and Guizhou Liyang",infoPartsEn:["The J-8 series is China's first independently designed high-altitude, high-speed fighter; its development embodies the leap of Shenyang Aircraft Design Institute (Institute 601) from licensed production to independent design.","The WP-13 engine is China's first aero engine independently designed and successfully fielded in numbers, jointly developed by Shenyang Liming Engine Corporation and Guizhou Liyang Corporation, powering types such as the J-8II.","Aircraft number 81192, flown by pilot Wang Wei, was a J-8II."],paramsEn:"High-altitude, high-speed fighter · two WP-13AII engines · maximum speed about Mach 2.2 · all-weather, all-altitude combat capability · can carry multiple air-to-air missiles and cannon. Performance data per public records.",meaningEn:"The WP-13 is China's first aero engine independently designed and successfully fielded in numbers, marking the transition of Chinese aero propulsion from licensed production to independent development and providing a strong domestic heart for high-altitude, high-speed fighters. In the late 1970s and early 1980s China obtained a MiG-21MF and its P-13 engine from Egypt and planned to copy them; due to materials and process constraints, the WP-13 series was ultimately developed with reference to the WP-7 series, yielding variants such as the WP-13AII powering the J-8II.",title:"第一架 高空高速 战机",name:"歼-8Ⅱ",engine:"涡喷-13",en:"涡喷-13AⅡ",enNote:"第一款自行设计并成功批量装备的航空发动机 · 沈阳黎明与贵州黎阳联合研制",img:"fighter_j8.jpg",detailImg:"fighter_j8_cut.png",engineImg:"engine_wp13.jpg",tag:"第一款自行设计并成功批量装备的发动机",

   info:"歼-8系列是中国自主设计的第一型高空高速战斗机，其研制历程体现了沈阳飞机设计研究所（601所）从仿制走向自行设计的跨越。涡喷-13发动机是我国第一款自行设计并且成功批量装备的航空发动机，由沈阳黎明发动机公司和贵州黎阳公司联合研制，配装歼-8Ⅱ等机型。飞行员王伟驾驶的81192号战机，正是歼-8Ⅱ。",

  {id:"j11",capEn:"J-11 heavy air-superiority fighter",titleEn:"The First Heavy Third-Generation Fighter",tagEn:"From Import to Independent Innovation, Filling the Gap in Heavy Third-Generation Fighters",enNoteEn:"China's first high-thrust turbofan engine · Shenyang Engine Design and Research Institute",infoPartsEn:["The J-11 is the domestic version of the Su-27, developed and manufactured by Shenyang Aircraft Corporation (SAC), filling the gap in China's heavy third-generation fighters.","From import to independent innovation — the rise of the J-11 series: in the 1990s China imported the Su-27 series from Russia, filling the gap in modern air force fighters and greatly lifting combat capability, but limited numbers and technological dependence also exposed problems. China therefore sought independent production, gradually mastering the Su-27's core technology through cooperation with Russia and developing the domestic J-11 series on that basis. The J-11A and J-11B marked the Chinese aviation industry's move toward autonomy.","The J-11 is a heavy fighter China manufactured in the 1990s from a Russian-imported Su-27SK production line, in response to changing international conditions and the needs of military struggle, to deal with modern local wars under high-tech conditions and the cross-strait military balance.","While retaining the Su-27's characteristics including its aerodynamic shape, SAC added Chinese domestic avionics, radar and weapon systems and the WS-10 engine, developing the J-11B and J-11BS — the aerodynamic shape is unchanged, but performance was improved and the internal structure optimized to extend service life."],paramsEn:"Heavy air-superiority fighter · two WS-10A domestic high-thrust engines · while retaining the Su-27's aerodynamic characteristics, SAC added domestic avionics, radar and weapon systems · internal structure optimized to extend service life.",meaningEn:"It filled the gap in China's heavy third-generation fighters. Even as the J-20 reaches sufficient scale, the J-11 will remain one of the Chinese Air Force's main forces for long-range air-superiority operations and seizing air dominance.",title:"第一架 重型三代 战机",name:"歼-11",engine:"涡扇-10A",en:"涡扇-10（太行）系列 · 涡扇-10A",enNote:"第一台大推力涡轮风扇发动机 · 沈阳发动机设计研究所",img:"fighter_j11.jpg",engineImg:"engine_ws10.jpg",tag:"从引进到自主创新，填补中国重型三代机空白",

   infoParts:[
     "歼-15由沈阳飞机公司（沈飞）制造，是中国自主研发的第一代舰载战斗机，也是典型的第三代战斗机，以T10K原型机为基础研制的一代国产舰载战斗机。",
     "2012年11月23日，由中航工业沈阳飞机工业（集团）有限公司和601所负责研制的中国第一代舰载机歼-15在辽宁舰上实现着舰和舰上起飞。该机是中国第一代远程、重型、超声速、高机动性固定翼舰载多用途战斗机，可用于编队防空、夺取海上局部制空权、突击敌海上大中型水面舰船、攻击敌海军基地及实施战术侦察。",
     "歼-15在辽宁舰首次成功起降，从这一天起，中国海上没有舰载机的时代成为历史，中国战斗机实现了从陆地向海洋的跨越。",
     "2012年11月25日，歼-15研制现场总指挥罗阳在随歼-15完成首次着舰任务后，因积劳成疾突发疾病，因公殉职，年仅51岁。传承航空报国、勇攀高峰的“罗阳精神”，航空工业新型号、新成果不断涌现。",
     "歼-15舰载机的成功研制，标志着中国战斗机实现了从陆基到海基的历史性跨越。"
   ],
   hero:"j11hero",
   infoParts:[
     "歼-11：是苏-27型战斗机的国产型号，由中国沈阳飞机公司（沈飞）研发制造，填补了中国重型三代机的空白。",
     "从引进到自主创新——歼-11系列的崛起：上世纪90年代，我国从俄罗斯引进了苏-27系列战机，填补了当时空军现代化战机的空白。苏-27的引进大幅提升了我国空军的作战能力，但数量的限制和技术依赖也暴露了问题。因此，我国开始寻求自主生产，在与俄罗斯合作的基础上逐步掌握了苏-27的核心技术，并在此基础上发展出了国产歼-11系列战机。歼-11A、歼-11B战机的问世，标志着我国航空工业开始迈向自主化。",
     "歼-11战斗机是中国在20世纪90年代为了提升空军作战能力，根据国际形势变化和军事斗争需要，从俄罗斯引进苏-27SK生产线制造的重型战斗机。这一决策是为了应对高技术条件下的现代局部战争，以及两岸军力平衡的需要。",
     "沈飞在保留苏-27包括气动外形等特性的情况下，加上了中国国产的航电、雷达、武器系统等和涡扇-10发动机，开发了衍生机型歼-11B、歼-11BS，虽然气动外形仍然没有变化，但在性能上有所改良，并优化内部结构提高了机体寿命。"
   ],
   info:"歼-11是苏-27型战斗机的国产型号，由中国沈阳飞机公司（沈飞）研发制造，填补了中国重型三代机的空白。从引进到自主创新——歼11系列的崛起：上世纪90年代，我国从俄罗斯引进了苏27系列战机，填补了当时空军现代化战机的空白。苏27的引进大幅提升了我国空军的作战能力，但数量的限制和技术依赖也暴露了问题。因此，我国开始寻求自主生产。在与俄罗斯合作的基础上，逐步掌握了苏27的核心技术，并在此基础上发展出了国产歼11系列战机。歼11A、歼11B战机的问世，标志着我国航空工业开始迈向自主化，也为歼11D的诞生奠定了坚实的基础。",
   params:"重型制空战斗机 · 装两台「涡扇-10A」型国产大推力发动机 · 沈飞在保留Su-27气动外形特性的基础上，加装国产航电、雷达与武器系统 · 优化内部结构，提高机体寿命。",
   meaning:"填补了中国重型三代机的空白。即便歼-20战斗机已经形成了足够的规模，歼-11战斗机仍将是中国空军执行远程空优作战并夺取制空权的主要力量之一。"},
  {id:"j15",capEn:"J-15 carrier fighter · arrested landing aboard Liaoning, 2012",titleEn:"The First Carrier-Based Fighter",tagEn:"China's First Carrier-Based Fighter · From Land to Sea",enNoteEn:"China's first high-thrust turbofan engine · Shenyang Engine Design and Research Institute",infoPartsEn:["Manufactured by Shenyang Aircraft Corporation (SAC), the J-15 is China's independently developed first-generation carrier fighter and a typical third-generation aircraft, developed from the T10K prototype.","On November 23, 2012, the J-15, developed by AVIC Shenyang Aircraft Corporation and Institute 601, achieved arrested landing and takeoff aboard the carrier Liaoning. It is China's first long-range, heavy, supersonic, highly maneuverable fixed-wing carrier multirole fighter, usable for fleet air defense, seizing local sea control, striking enemy large and medium surface ships, attacking enemy naval bases and conducting tactical reconnaissance.","With the J-15's successful takeoff and landing aboard Liaoning, the era in which China had no carrier aircraft at sea became history; Chinese fighters achieved the leap from land to ocean.","On November 25, 2012, Luo Yang, on-site commander of the J-15 program, died of illness brought on by overwork after the first carrier landing, aged only 51. Carrying forward the Luo Yang spirit of serving the nation through aviation and scaling the heights, new types and achievements of the aviation industry keep emerging.","The successful development of the J-15 marks the historic leap of Chinese fighters from land-based to sea-based."],paramsEn:"First-generation long-range, heavy, supersonic, highly maneuverable fixed-wing carrier multirole fighter · two WS-10 high-thrust turbofan engines · canard plus leading-edge root extension layout, twin-engine heavy type · capable of ski-jump takeoff and arrested landing.",meaningEn:"With the J-15's successful takeoff and landing aboard Liaoning, the era in which China had no carrier aircraft at sea became history, and Chinese fighters achieved the leap from land to ocean. Its successful development marks the historic leap of Chinese fighters from land-based to sea-based, of major strategic significance for strengthening national defense and safeguarding the nation's maritime rights and interests.",title:"第一代 舰载 战机",name:"歼-15",engine:"涡扇-10",en:"涡扇-10（太行）系列",enNote:"第一台大推力涡轮风扇发动机 · 沈阳发动机设计研究所",img:"fighter_j15.jpg",engineImg:"engine_ws10.jpg",tag:"中国第一代舰载战斗机 · 从陆基到海基",
   radar:{axes:[["机炮/挂载","GSh-30-1机炮",1],["最大升限","20000米",20000],["作战半径","1500英里",1500],["起飞重量","32.5吨",32.5],["最大速度","2.4马赫",2.4],["推力","132kN",132]],max:[10,25000,2000,40,2.5,150]},
   base:{设计:"沈阳飞机工业集团",生产:"沈阳飞机工业集团",类型:"舰载战斗机、多功能战斗机",乘员:"1人",造价:"¥4亿",现况:"试飞中"},
   engineSpec:[["引擎总长","4950mm"],["最大外径","1160mm"],["单具重量","1794.7kg"],["最大推力","13539daN"]],
   info:"由沈阳飞机公司（沈飞）制造。中国自主研发的第一代舰载战斗机，也是典型的第三代战斗机，以T10K原型机为基础研制的一代国产舰载战斗机。2012年11月23日，由中航工业沈阳飞机工业(集团)有限公司和601所负责研制的中国第一代舰载机歼-15在辽宁舰上实现着舰和舰上起飞。该机是中国第一代远程、重型、超声速、高机动性固定翼舰载多用途战斗机，可用于编队防空，夺取海上局部制空权，突击敌海上大中型水面舰船，攻击敌海军基地、港口和陆上浅纵深的重要目标以及实施战术侦察。",
   params:"第一代远程、重型、超声速、高机动性固定翼舰载多用途战斗机 · 装两台「涡扇-10」型大推力涡扇发动机 · 鸭翼+边条翼布局，双发重型 · 具备滑跃起飞 / 阻拦着舰能力。",
   meaning:"歼-15在辽宁舰首次成功起降，从这一天起，中国海上没有舰载机的时代成为历史，中国战斗机实现了从陆地向海洋的跨越。歼-15舰载机的成功研制，标志着中国战斗机实现了从陆基到海基的历史性跨越，对加强国防建设、维护国家海洋权益具有重大的战略意义。",
   hero:"luoyang"},
  {id:"j35",capEn:"J-35A new-generation stealth fighter",titleEn:"The New-Generation Stealth Fighter",tagEn:"Stealth, Informatization, Networking, Intelligence",enNoteEn:"New-generation high-thrust turbofan engine · exhibition materials subject to the physical exhibits",infoPartsEn:["The J-35A is a new-generation medium stealth multirole fighter independently developed by the Aviation Industry Corporation of China (AVIC), with integrated airframe, aerodynamic and stealth design — a single-seat, twin-engine, blended wing-body configuration with twin swept canted tails and all-moving horizontal tails. It is a force in the stealth and counter-stealth combat system, capable against air, ground and sea targets, focused on air-superiority missions while also carrying out surface strikes.","As China's new-generation stealth fighter, its novelty lies mainly in stealth, informatization, networking and intelligence.","The J-35A mainly performs the mission of seizing and maintaining air superiority, striking enemy third- and fourth-generation fighters and ground and sea air-defense forces, and intercepting enemy fighters, bombers and cruise missiles.","Its salient advantages can be summed up as detect the enemy first, kill the enemy first, seize the initiative. Against the previous generation it can remain outside the enemy's effective sensing range for one-way transparent battlefield awareness and an overwhelming edge; against same-generation aircraft it relies on strong individual lethality and survivability and advanced formation cooperation to close the kill chain quickly and stably, seizing the initiative."],paramsEn:"New-generation medium stealth multirole fighter · single-seat, twin-engine, blended wing-body, twin swept canted tails, all-moving horizontal tail layout · two WS-19 engines · focused on air-superiority missions while carrying out surface strikes.",meaningEn:"The J-35A mainly performs the mission of seizing and maintaining air superiority. Its salient advantages can be summed up as detect the enemy first, kill the enemy first, seize the initiative: against the previous generation it can stay outside the enemy's effective sensing range for one-way transparent battlefield awareness; against same-generation aircraft it relies on strong lethality and survivability and formation cooperation to close the enemy kill chain quickly and stably.",title:"新一代 隐身 战机",name:"歼-35A",engine:"涡扇-19",en:"涡扇-19",enNote:"新一代大推力涡扇发动机 · 展陈素材以实物展品为准",img:"fighter_j35.jpg",engineImg:null,tag:"隐身化、信息化、网络化、智能化",
   radar:{axes:[["机炮/挂载","内埋挂点4个/外部挂点6个",10],["最大升限","18000米",18000],["作战半径","1350KM",1350],["起飞重量","25吨",25],["最大速度","2.2马赫",2.2],["推力","10t（约98kN）",98]],max:[10,25000,2000,40,2.5,150]},
   base:{设计:"沈阳飞机设计研究所",生产:"沈阳飞机工业集团",类型:"第五代隐形多用途战机",乘员:"1人",造价:"$5400万",现况:"未服役"},
   hero:"j35hero",
   infoParts:[
     "歼-35A是由中国航空工业集团自主研制的新一代中型隐身多用途战斗机，采用总体/气动/隐身一体化设计的单座、双发、翼身融合、双后掠外倾垂尾、全动平尾的正常式布局，是隐身与反隐身作战体系的规模组成力量，对空、对地、对海都可以，以制空作战为主，兼顾对面作战。",
     "作为中国新一代隐身战斗机，歼-35A的“新”主要体现在隐身化、信息化、网络化、智能化。",
     "歼-35A主要遂行夺取并保持制空权任务，打击敌方三/四代战斗机、地面/海上防空力量，拦截敌方战斗机、轰炸机、巡航导弹等空中目标。",
     "歼-35A的显著优势，可以概括为“先敌发现、先敌杀伤、抢占先机”。在对抗上一代飞机时，歼-35A可以保持在敌方有效感知范围外，实现战场态势的单向透明，具有压倒性优势；在对抗同代飞机时，可凭借单机的强杀伤力与生存力以及编队协同作战的先进手段，实现对敌杀伤链的快速、稳定闭环，从而抢占先机。"
   ],
   info:"歼-35A是由中国航空工业集团自主研制的新一代中型隐身多用途战斗机，采用总体/气动/隐身一体化设计的单座、双发、翼身融合、双后掠外倾垂尾、全动平尾的正常式布局，是隐身与反隐身作战体系的规模组成力量，对空、对地、对海都可以，以制空作战为主，兼顾对面作战。作为中国新一代隐身战斗机，歼-35A的「新」主要体现在隐身化、信息化、网络化、智能化。",
   params:"新一代中型隐身多用途战斗机 · 单座、双发、翼身融合、双后掠外倾垂尾、全动平尾正常式布局 · 装两台「涡扇-19」型发动机 · 以制空作战为主，兼顾对面作战。",
   meaning:"歼-35A主要遂行夺取并保持制空权任务。其显著优势可以概括为「先敌发现、先敌杀伤、抢占先机」：对抗上一代飞机时，可保持在敌方有效感知范围外，实现战场态势的单向透明；对抗同代飞机时，可凭借强杀伤力与生存力以及编队协同作战，实现对敌杀伤链的快速、稳定闭环。"}

const HEROES={
  j5hero:{id:"j5hero",nameEn:"J-5 Combat Heroes",titleEn:"The First Domestic Jet Fighter · Illustrious War Merit Guarding the Skies",parasEn:["On February 18, 1958, Naval Aviation pilots Hu Chunsheng and Shu Jicheng, flying as a pair, shot down a Nationalist RB-57A reconnaissance aircraft over Qingdao, Shandong — the first case of Naval Aviation J-5s downing an enemy plane.","On August 25, 1958, Air Force 9th Division pilot Liu Weimin shot down two Nationalist F-86 fighters over Zhangzhou, Fujian.","On the night of May 29, 1959, pilot Jiang Zhelun, guided by radar, flew a J-5A and shot down a Nationalist B-17G bomber over Wuzhou, Guangxi — the Chinese Air Force's first night air-combat victory.","In September 1958 over Wenzhou, pilot Wang Zizhong shot down two F-86s single-handed before heroically sacrificing his life. The wreckage of the AIM-9 Sidewinder missile left from the battle led China to copy it as the PL-2 air-to-air missile.","On April 24, 1967, a J-5 shot down an intruding U.S. F-4B Phantom over the Guangxi border; the battle lasted 3 minutes 35 seconds."],name:"歼-5 战斗英雄群像",code:"",title:"第一架国产喷气式战机 · 战功赫赫守卫蓝天",img:"",engine:"涡喷-5",fighter:"歼-5",
    paras:[
      "1958年2月18日，海军航空兵四师胡春生、舒积成双机组在山东青岛上空击落国民党军队RB-57A侦察机1架，首创海航歼-5击落敌机的战例。",
      "1958年8月25日，空军第九师飞行员刘维民在福建漳州上空击落2架国民党军队F-86战斗机。",
      "1959年5月29日夜，空军飞行员蒋哲伦在雷达引导下，驾驶歼-5甲在广西梧州上空击落国民党空军B-17G轰炸机1架，创下中国空军首次夜间空战战果。",
      "1958年9月温州上空，飞行员王自重单机击落2架F-86后壮烈牺牲；其战机遗留的AIM-9「响尾蛇」导弹残骸，促成我国仿制出霹雳-2空空导弹。",
      "1967年4月24日，歼-5在广西边境上空击落入侵的美军F-4B「鬼怪」战斗机1架，此战历时3分35秒。"

  j6hero:{id:"j6hero",nameEn:"J-6 Combat Heroes",titleEn:"The Domestic Fighter with the Richest Homeland Air-Defense Results",parasEn:["From 1964 to 1968, J-6s of the Air Force and Naval Aviation shot down or damaged 22 U.S. aircraft of various types, including the RF-101, A-3B, A-3D, A-6A and types outperforming the J-6 such as the F-104, F-4B and F-4C, without a single J-6 being shot down.","On September 20, 1965, Naval Aviation pilot Gao Xiang, flying a J-6, opened fire at the extreme distance of about 39 meters and shot down a U.S. F-104C, capturing its pilot — setting the record for the closest firing distance in world air-combat history and the first case of a U.S. plane downed over Chinese airspace.","Pilot Gao Changji, flying a J-6, first shot down a Nationalist RF-101 reconnaissance aircraft, setting the record for downing an enemy plane under supersonic conditions in world air-combat history.","Squadron leader Xu Kaitong of an Air Force division climbed to the extreme altitude, closed to 400 meters behind the enemy and fired decisively, shooting down a U.S.-made BQM-147G Firebee high-altitude unmanned reconnaissance drone — the first case of a J-6 downing a high-altitude drone."],name:"歼-6 战斗英雄群像",code:"",title:"国土防空战果最丰的国产战机",img:"",engine:"涡喷-6",fighter:"歼-6",
    paras:[
      "1964年至1968年，人民空军和海军航空兵装备的歼-6先后击落击伤各型美机22架，包括RF-101、A-3B、A-3D、A-6A以及性能优于歼-6的F-104、F-4B、F-4C等机型，自身无一架被击落。",
      "1965年9月20日，海军航空兵飞行员高翔驾驶歼-6在约39米极限距离开炮，击落美军F-104C战斗机并俘获其飞行员，创造了世界空战史上最近交火距离的纪录，也是中国领空首次击落美机的战例。",
      "飞行员高长吉驾驶歼-6首次击落国民党空军RF-101侦察机，创造了世界空战史上超音速条件下击落敌机的纪录。",
      "空军航空兵某师中队长徐开通驾驶歼-6，爬升至极限高度，追至敌机尾后400米处果断开炮，击落美制BQM-147G「火蜂」高空无人侦察机，首创歼-6击落高空无人机的战例。"
    ]},
  wangwei:{id:"wangwei",nameEn:"Wang Wei",titleEn:"Sea and Sky Guardian · First-Class Model Hero",parasEn:["Wang Wei was born on April 6, 1968 in Huzhou, Zhejiang Province. In life he was a squadron leader of a Naval Aviation unit and a first-class pilot.","Wang Wei held the ideal of joining the military to serve the country from childhood. He became a military flight academy cadet in 1986 and later joined the Communist Party of China for his outstanding performance.","He set several firsts at the flight academy — the first in his class to fly solo, and the first to reach 1,000 flight hours, becoming an all-weather pilot qualified in four weather conditions.","On April 1, 2001, a U.S. Navy EP-3 reconnaissance aircraft illegally entered the airspace above China's exclusive economic zone, and Wang Wei was ordered to track and monitor it. After repeated warnings went unheeded, the U.S. aircraft suddenly and maliciously rammed the fighter Wang Wei was flying, badly damaging his plane. After failing to save the fighter, Wang Wei had to eject and parachute into the sea, ultimately sacrificing his life at the age of 33.","After Wang Wei went into the sea, the Chinese Navy, local units and the people fought continuously for 14 days and nights in a large-scale search and rescue operation, but Wang Wei was not found.","On April 24, 2001 the Central Military Commission awarded Wang Wei the honorary title Sea and Sky Guardian and the First-Class Model Hero Medal; the Navy Party Committee approved him as a revolutionary martyr. Wang Wei's story and spirit are widely told, forming an important part of China's national defense and patriotism education.","Wang Wei's deeds inspire generation after generation of Chinese people; his spirit and number 81192 remain forever in people's hearts as an indelible memory. Every April 1 people commemorate this hero in various ways, calling out: 81192, please return."],name:"王伟",code:"81192",title:"海空卫士 · 一级英模",img:"hero_wangwei.jpg",engine:"涡喷-13",fighter:"歼-8Ⅱ",
    paras:["王伟，1968年4月6日出生于浙江省湖州市，生前是中国海军航空兵某部飞行中队长，一级飞行员。","王伟从小就有从军报国的理想，1986年成为军校飞行学员，后因表现优异加入中国共产党。","在飞行学院创下了多个「第一」，是同期学员中第一个放单飞的飞行员，也是第一个飞满1000小时，成为能飞4种气象的「全天候」飞行员。","2001年4月1日，美国海军EP-3侦察机非法进入中国专属经济区上空，王伟奉命对其进行跟踪监视。在多次警告无效后，美军飞机突然恶意撞向王伟驾驶的战斗机，导致王伟的飞机受损严重。王伟在极力救护战斗机未果后，不得不弃机跳伞，坠入大海，最终壮烈牺牲，年仅33岁。","王伟落海后，中国海军及地方有关单位和人民群众连续奋战14个昼夜，展开了大规模的搜救行动，但未能找到王伟。","中央军委于2001年4月24日授予王伟「海空卫士」荣誉称号和一级英模奖章，海军党委批准王伟为革命烈士。王伟的故事和精神被广泛传颂，成为中国国防和爱国主义教育的重要组成部分。","王伟烈士的事迹激励着一代又一代的中国人，他的精神和编号81192永远留在了人们的心中，成为永不磨灭的记忆。每年的4月1日，人们都会以各种方式缅怀这位英雄，呼唤「81192，请返航」。"]},
  luoyang:{id:"luoyang",nameEn:"Luo Yang",titleEn:"Reform Pioneer · An Outstanding Representative Who Lived Out Serving the Nation Through Aviation",parasEn:["Luo Yang was born on June 29, 1961 in Shenyang, Liaoning Province, into a military family.","He began work in 1982 and joined the Communist Party of China in 1986. He served as a designer at Shenyang Aircraft Design Institute, head of its Party Committee Organization Department, and Party Secretary and first deputy director. From 2007 he was chairman and general manager of AVIC Shenyang Aircraft Corporation (SAC).","Luo Yang loved the Party and country and loved aviation, devoting 30 years to it and working with utter dedication until the last moment of his life. He held unswervingly to the belief of serving the nation through aviation, saying: Our greatest pursuit is, through our efforts, to see our advanced fighters equip the forces sooner and our national defense industry quickly narrow the gap with developed countries.","As on-site commander of the J-15 carrier fighter program, Luo Yang led the team to complete the development of the J-15 and several other key models, successfully achieving first flight and design finalization and driving major progress in military fighter development.","While Luo Yang was SAC general manager, SAC achieved the first flight of five models, the number of fighters delivered each year rose greatly, and output value climbed from 4.9 billion to 12.3 billion yuan. He drove the transformation of the company's operating model, lifted its overall strength and led SAC onto a fast track of sustained, leapfrog development.","On November 25, 2012, after taking part in carrier takeoff and landing training aboard China's first aircraft carrier, the Liaoning, Luo Yang suffered a sudden myocardial infarction and cardiac sudden death, dying at his post at the age of 51.","Luo Yang was posthumously awarded the titles Reform Pioneer, Most Beautiful Striver, Outstanding Communist Party Member and Aviation Industry Model Hero.","Luo Yang's life was one of unremitting struggle for China's aviation industry and national defense. The successful development and service of the J-15 carrier fighter not only lifted the Chinese Navy's combat capability but also marked major progress in China's aviation industry. Though Luo Yang has passed away, his spirit and contributions will always be remembered."],name:"罗阳",code:"",title:"改革先锋 · 用生命践行航空报国的优秀代表",img:"hero_luoyang.jpg",engine:"涡扇-10",fighter:"歼-15",
    paras:["罗阳，1961年6月29日出生于辽宁省沈阳市一个军人家庭。","1982年参加工作，1986年加入中国共产党。曾任沈阳飞机设计研究所设计员，党委组织部部长，党委书记兼第一副所长。2007年起任中航工业沈阳飞机工业（集团）有限公司董事长、总经理。","罗阳同志爱党爱国、热爱航空，献身航空30载，为航空工业的发展披肝沥胆、鞠躬尽瘁，直至生命的最后一刻。他坚定航空报国的信念，至死不渝，曾说：「我们最大的追求就是通过我们的努力，使我国的先进战机能够早日装备部队，使我国的国防工业能够尽快缩小与发达国家的差距。」","作为歼-15舰载机研制现场总指挥，罗阳带领团队完成了歼-15舰载机等多个重点型号研制并成功实现首飞和设计定型，推动军用战斗机研制取得重大进展。","在罗阳担任沈飞总经理期间，沈飞实现5个型号首飞，每年为客户交付的战机数量大幅增加，产值从49亿元上升至123亿元。他推动企业经营模式转型，提升企业综合实力，带领沈飞迈入持续跨越发展的快车道。","2012年11月25日，罗阳在随中国首艘航空母舰「辽宁舰」参与舰载机起降训练后，突发心肌梗死、心源性猝死，以身殉职，享年51岁。","罗阳同志被追授「改革先锋」「最美奋斗者」「全国优秀共产党员」「航空工业英模」等称号。","罗阳的一生是为中国航空工业和国防事业不懈奋斗的一生。歼-15舰载机的成功研制和服役，不仅提升了中国海军的作战能力，也标志着中国在航空工业领域取得了重大进步。罗阳同志虽然已经离世，但他的精神和贡献将永远被铭记。"]},
  j11hero:{id:"j11hero",nameEn:"J-11 Unit Group Portrait",titleEn:"The First Unit on Combat Air Patrol in the East China Sea ADIZ",parasEn:["On November 23, 2013 China announced the establishment of the East China Sea Air Defense Identification Zone. On the day it was set up, pilots of an Air Force brigade flew J-11s to the controlled airspace on combat air patrol, becoming the Air Force's first fighter unit to carry out such a mission there.","In 2016 the brigade's J-11s and H-6K formations flew over the Miyako Strait, successfully breaking through the so-called first island chain and dealing lawfully and decisively with harassment by foreign military aircraft.","An Eastern Theater Command Air Force brigade, home of the Wang Hai Squadron, has outstandingly carried out routine control of the East China Sea ADIZ, fighting dozens of times across the deserts, plateaus and seas, producing advanced figures such as the Model of the Times Hao Jingwen."],name:"歼-11 部队群像",code:"",title:"东海防空识别区首个战备警巡部队",img:"",engine:"涡扇-10A",fighter:"歼-11",
    paras:[

      "2016年，该旅歼-11战机与轰-6K编队飞越宫古海峡，成功突破所谓「第一岛链」，面对外军飞机袭扰依法果断处置。",
      "「王海大队」所在的东部战区空军航空兵某旅，出色完成东海防空识别区常态化管控任务，数十次征战大漠、奋战高原、鏖战海天，涌现出「时代楷模」郝井文等先进人物。"
    ]},
  j35hero:{id:"j35hero",nameEn:"J-35A Development Team",titleEn:"The New-Generation Stealth Fighter · Carrying On Service to the Nation Through Aviation",parasEn:["The J-35A is independently developed by the Aviation Industry Corporation of China as a new-generation medium stealth multirole fighter, representing the latest achievements of Chinese aviation in stealth, informatization, networking and intelligence.","As the new-generation model inherited from Shenyang's aviation industry, the J-35A development team carries on the Luo Yang spirit and the tradition of serving the nation through aviation, continuously tackling key problems in stealth overall design, advanced materials and processes.","This type has not yet entered service and there are currently no public heroic personal deeds; related development and testing information is subject to official releases."],name:"歼-35A 研制团队",code:"",title:"新一代隐身战机 · 接续航空报国",img:"",engine:"涡扇-19",fighter:"歼-35A",
    paras:[

      "作为沈阳航空工业传承的新一代型号，歼-35A的研制团队传承「罗阳精神」与航空报国传统，在隐身总体设计、先进材料与工艺等方面持续攻关。",
      "该机型尚未服役，暂无公开的英雄人物事迹；相关研制与试验信息以官方发布为准。"
    ]}

  "1965年4月9日，4架解放军空军所属的米格-17/歼-5战机于南海上空与美国海军的F-4B遭遇，发生近距离空中冲突。海航四师李大云驾驶歼-5追击1架美军F-4B，另一架F-4B尾随在李大云后发射了「响尾蛇」导弹，李大云驾机迅速作出机动动作摆脱了导弹。由于当时「响尾蛇」导弹采用热感应追踪目标，没有敌我识别能力，结果将李大云先前追击的F-4B飞机击落。",
  "1967年4月24日，美军出动大批F-4、F-8战斗机轰炸越南谅山。其中两架F-4B「鬼怪」式战斗机从广西板兴侵入了中国边境领空，1架被高炮击落，另一架扔掉副油箱和起落架加速脱离，被高空待战的4架歼-5战斗机采用大角度80度接敌。二号机4次开炮没有击中敌机，一号机连续猛烈射击，前两次都未打中，最后一次抵近400米射击击中敌机，F-4坠入北部湾。此战历时3分35秒。"

const BATTLE_EN=["On February 18, 1958, Naval Aviation pilots Hu Chunsheng and Shu Jicheng, flying as a pair, shot down a Nationalist RB-57A reconnaissance aircraft over Qingdao, Shandong.","On the night of April 21, 1958, a B-17G reconnaissance aircraft flew low into Jiangxi. Air Force 12th Division pilot Li Shunxiang, flying a J-5A (MiG-17PF) and guided by the command post with improved onboard radar, damaged it at about 300 meters altitude.","On August 25, 1958, Air Force 9th Division pilot Liu Weimin shot down two Nationalist F-86s over Zhangzhou, Fujian.","At 21:00 on May 29, 1959, a B-17G entered from the Leizhou Peninsula near Wuzhou, Guangxi. At 23:08, on-duty commander Li Xiangang of Guangzhou Air 18th Division ordered squadron leader Jiang Zhelun of the 52nd Regiment interceptor group to take off. With radar contact intermittent, Jiang Zhelun, guided by ground navigators, flew through gaps in the clouds, found the target at 3.2 km with onboard radar, locked on at 2 km and shot the B-17G down.","In September 1958 a J-5 formation encountered over Wenzhou, Zhejiang a formation of 24 Nationalist F-86s armed with the new AIM-9B Sidewinder. According to PLA records, pilot Wang Zizhong, having fallen behind, was set upon by 12 F-86s; he shot down two enemy planes single-handed before being downed by a Sidewinder, the missile's first combat kill. One Sidewinder, however, lodged in a J-5 without exploding and was afterward copied by the Soviet Union and China as the K-13 (AA-2) and PL-2 missiles.","On April 9, 1965, four PLA MiG-17/J-5 fighters had a close aerial encounter over the South China Sea with U.S. Navy F-4Bs. Naval Aviation pilot Li Dayun chased one F-4B; another F-4B behind him fired a Sidewinder, which Li Dayun maneuvered to evade. As the Sidewinder was heat-seeking with no IFF, it shot down the F-4B Li Dayun had been chasing.","On April 24, 1967, large numbers of U.S. F-4 and F-8 aircraft bombed Lang Son, Vietnam. Two F-4B Phantoms crossed the border at Banxing, Guangxi; one was downed by anti-aircraft guns, while the other jettisoned drop tanks and accelerated away, met at an 80-degree angle by four J-5s on standby. The No.2 aircraft fired four times without hits; the No.1 fired in sustained bursts, missing the first two times and finally closing to 400 meters to hit; the F-4 fell into the Gulf of Tonkin. The battle lasted 3 minutes 35 seconds."];
const MILES_EN=[["1949", "China's first lathe: Shenyang No.1 Machinery Factory, predecessor of Shenyang No.1 Machine Tool Works, produced China's first lathe, the six-foot belt-driven lathe."], ["1953", "China's first engine lathe: as one of the country's 156 key construction projects, Shenyang No.1 Machine Tool Works introduced Soviet machine-building and management technology and independently developed the C620-1."], ["1964", "China's first semi-automatic camshaft lathe: Shenyang No.1 Machine Tool Works independently developed the CT8305."], ["1965", "China's first pipe joint boring machine: Shenyang No.1 Machine Tool Works independently developed the Q1545."], ["1973", "China's first CNC lathe: the CSK6163 was successfully developed at Shenyang No.1 Machine Tool Works, marking the arrival of the automation age in China's lathe field."], ["1989", "China's first flexible machining cell: Shenyang No.1 Machine Tool Works, introducing Heidemann technology from Germany, produced China's first flexible machining cell."]];
