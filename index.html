const INSTITUTES={
  hrb:{cityEn:"Harbin",nameEn:"AVIC Aerodynamics Research Institute (Harbin Campus)",briefEn:"Formerly the Harbin Aerodynamics Research Institute, founded in 1955, focused on applied aerodynamics research, numerical aerodynamic computation, wind tunnel testing and test technology, and related measurement and control instruments.",fullEn:"AVIC Aerodynamics Research Institute (Harbin Campus), formerly the Harbin Aerodynamics Research Institute (Institute 627), was founded in 1955 and is a specialized aerodynamics institution under the Aviation Industry Corporation of China (AVIC). Located on Yiman Street in Harbin, Heilongjiang, it focuses on applied aerodynamics research, numerical aerodynamic computation, wind tunnel testing and test technology, and related measurement and control instruments. As an important contributor to China's aviation industry, it has taken part in several key domestic aircraft programs and conducted hundreds of thousands of wind tunnel tests. It gained the right to train aerodynamics master's students in 1982 and set up a postdoctoral research station in 2002, making a marked contribution to the field.",city:"哈尔滨",region:"东北",code:"627所",name:"航空工业空气动力研究院（哈尔滨院区）",
    brief:"前身哈尔滨空气动力研究所，成立于1955年，专注于航空气动力应用研究、气动力数值计算、风洞实验与实验技术研究以及相关测控仪器设备的研制。",
    full:"航空工业空气动力研究院（哈尔滨院区），前身哈尔滨空气动力研究所（627所），成立于1955年，是中国航空工业集团有限公司下属的空气动力专业研究机构。位于黑龙江省哈尔滨市南岗区一曼街2号，哈尔滨院区专注于航空气动力应用研究、气动力数值计算、风洞实验与实验技术研究，以及相关测控仪器设备的研制。作为中国航空工业的重要贡献单位，哈尔滨院区参与了国内多个重点飞机型号的研制工作，并进行了数十万次风洞试验。此外，哈尔滨院区于1982年获得空气动力学专业硕士培养权，2002年设立博士后科研工作站，为我国航空气动力领域的发展做出了显著贡献。"},
  sy:{cityEn:"Shenyang",nameEn:"AVIC Aerodynamics Research Institute (Shenyang Campus)",briefEn:"Formerly the Shenyang Aerodynamics Research Institute, founded in 1958, later merged with Institute 627 to form AVIC Aerodynamics Research Institute; it has taken part in nearly every key domestic aircraft program.",fullEn:"AVIC Aerodynamics Research Institute (Shenyang Campus) is a specialized institution under the Aviation Industry Corporation of China, located in Shenyang, Liaoning. Formerly the Shenyang Aerodynamics Research Institute (Institute 626), founded in 1958, it merged in 2000 with the Harbin Aerodynamics Research Institute (Institute 627) to form AVIC Aerodynamics Research Institute. The Shenyang campus focuses on basic aerodynamics research, aircraft aerodynamic layout design, applied aerodynamics, computational aerodynamics and wind tunnel testing, and has taken part in nearly every key domestic aircraft program, conducting hundreds of thousands of wind tunnel tests such as those for the C919. It has been named a Major Contributor to China's Aviation Industry.",city:"沈阳",region:"东北",code:"626所",name:"航空工业空气动力研究院（沈阳院区）",
    brief:"前身沈阳空气动力研究所，始建于1958年，后与627所合并组建中国航空工业空气动力研究院，参与国内几乎所有重点飞机型号的研制。",
    full:"航空工业空气动力研究院（沈阳院区）是中国航空工业集团有限公司下属的专业研究机构，位于辽宁省沈阳市。前身为沈阳空气动力研究所（626所），始建于1958年，后于2000年与哈尔滨空气动力研究所（627所）合并组建成中国航空工业空气动力研究院。作为事业法人单位，沈阳院区专注于航空气动力基础研究、飞行器气动布局设计技术、空气动力应用技术、计算空气动力学、风洞试验技术等领域的研究，并参与了国内几乎所有重点飞机型号的研制工作，进行了数十万次风洞试验，如C919飞机的风洞试验，被评为「中国航空工业重大贡献单位」。",cons:"626"},
  bj:{cityEn:"Beijing",nameEn:"China Aviation Comprehensive Technology Research Institute",briefEn:"The aviation industry's only key laboratory focused on environmental and reliability research, and a core unit for aviation standardization.",fullEn:"China Aviation Comprehensive Technology Research Institute (AVIC Institute 301) is under the Aviation Industry Corporation of China and is the aviation industry's only key laboratory focused on environmental and reliability research. It undertakes basic technology research and is a core unit for aviation standardization, including the standardization research centers of COSTIND and the GAD, the Aviation Productivity Promotion Center, the Aviation Comprehensive Environment Key Laboratory and the Aviation Standard Parts Testing Center. It also runs national level-2 work-safety training and, as China's technical counterpart to the ISO aerospace technical committee, hosts the ISO/TC20/SC1 secretariat, working on reliability design, environmental adaptability, test evaluation and international standardization. In aircraft research it focuses on standardization, airworthiness regulations and standards, and international cooperation and mutual recognition, involving aircraft such as the ARJ21, MA700, C919, AC311 and AC313.",city:"北京",region:"华北",code:"301所",name:"中国航空综合技术研究所",
    brief:"航空行业内唯一专注于环境与可靠性研究的航空科技重点实验室，也是航空工业标准化技术的核心单位。",
    full:"中国航空综合技术研究所（航空301所）隶属于中国航空工业集团公司（AVIC），是航空行业内唯一专注于环境与可靠性研究的航空科技重点实验室。该所不仅承担技术基础研究工作，还是航空工业标准化技术的核心单位，包括国防科工委、总装备部电子信息基础部标准化研究中心，航空生产力促进中心，航空综合环境重点实验室，航空标准件检测中心等。此外，301所还负责国家二级安全生产培训，并作为ISO组织航空航天技术委员会的中国归口单位，承担ISO/TC20/SC1秘书处工作，致力于可靠性设计、环境适应性、试验评价等多个领域的研究与国际标准化工作。中国航空综合技术研究所（301所）在飞机型号研究方面，主要聚焦于标准化工作、适航规章及标准体系研究，以及国际合作与标准互换互认机制的建立，涉及的飞机型号包括ARJ21、新舟700、C919、AC311和AC313等。"},
  sh:{cityEn:"Shanghai",nameEn:"China National Aeronautical Radio Electronics Research Institute",briefEn:"Focused on avionics systems integration, core avionics processing and application technology, and aeronautical radio communication and navigation research and product development.",fullEn:"China National Aeronautical Radio Electronics Research Institute (Institute 615) is a high-technology institution under the Aviation Industry Corporation of China, located in the Caohejing High-Tech Park in Shanghai. It focuses on avionics systems integration, core avionics processing and application technology, and aeronautical radio communication and navigation research and product development. It has made a major contribution to the aviation industry and national defense, seizing strategic opportunities especially since the 9th Five-Year Plan. The federated integrated avionics systems it led and its preliminary research on integrated avionics were applied to in-service aircraft such as the J-10 and Y-8, earning the Outstanding Contribution Award for Serving the Nation Through Aviation. In recent years it has won over 100 provincial and ministerial awards, and in 2007 received the special and second prizes of the National Science and Technology Progress Award. It integrates research, production and operations and has held the title Shanghai Civilized Unit for five consecutive terms.",city:"上海",region:"华东",code:"615所",name:"中国航空无线电电子研究所",
    brief:"专注于航空电子系统总体与综合、航空电子核心处理与综合应用技术、航空无线电通讯导航技术的研究与产品研制。",
    full:"中国航空无线电电子研究所（615所）是中国航空工业集团公司下属的高科技研究所，位于上海市漕河泾高新技术开发区。该所专注于航空电子系统总体与综合、航空电子核心处理与综合应用技术、航空无线电通讯导航技术的研究与产品研制。615所在航空工业和国防建设中作出了重大贡献，特别是在「九五」以来抓住战略机遇期，实现了快速发展。其主持研制的联合式航电综合系统和综合式航电系统预研等项目在歼十和运八等现役飞机上得到应用，荣获「航空报国突出贡献奖」。近五年来，615所获得省部级科技成果奖100多项，2007年获得国家科学技术进步奖特等奖和二等奖。坚持科研、生产、经营一体化发展，经济收入快速增长，人均销售收入和创利连续多年名列前茅。615所还连续五届十年荣获「上海市文明单位」称号，获得「全国企业文化建设优秀单位奖」和「全国企业文化建设优秀成果奖」。"},
  nc:{cityEn:"Nanchang",nameEn:"AVIC Hongdu Aircraft Design and Research Institute",briefEn:"One of China's oldest aircraft design institutes, having developed 12 aircraft categories and over 40 models including the CJ-5, CJ-6, Q-5, J-12, K-8, JL-8 and L-15.",fullEn:"AVIC Hongdu Aircraft Design and Research Institute, also called Institute 650, is one of China's oldest aircraft design institutes, with complete aircraft design and testing capabilities and the ability to provide relatively advanced flight training systems. It has developed 12 categories and over 40 models, including the CJ-5, CJ-6, Q-5, J-12, K-8, JL-8 and L-15 (JL-10), with trainers forming a full primary, intermediate and advanced series. The L-15 advanced trainer is the only domestic trainer developed in step with the advanced international level. As an important base for China's aircraft design, Hongdu has made an outstanding contribution, especially in trainers, building a full-spectrum product line from primary to advanced.",city:"南昌",region:"华东",code:"650所",name:"航空工业洪都飞机设计研究所",
    brief:"中国历史最悠久的飞机设计研究所之一，先后研制了初教5、初教6、强5、歼12、K8、JL8、L15等12个机种、40多个型号。",
    full:"航空工业洪都飞机设计研究所，也称为650所，是中国历史最悠久的飞机设计研究所之一，具备完整的飞机设计、试验能力，并能提供较为领先的飞行训练系统。该研究所先后研制了初教5、初教6、强5、歼12、K8、JL8、L15（教10）等12个机种，40多个型号，其中教练机已形成初、中、高级系列发展。L15高级教练机是国内唯一一个与国际先进水平同步发展的教练机。洪都飞机设计研究所作为我国飞机设计的重要基地，为我国航空工业的发展作出了突出贡献，特别是在教练机领域形成了从初级到高级的全谱系教练机产品。"},
  jd:{cityEn:"Jingdezhen",nameEn:"China Helicopter Research and Development Institute",briefEn:"China's only helicopter design institute, capable of developing third- and fourth-generation helicopters; it has developed 12 series and over 60 models including the Z-8, Z-10 and Z-20.",fullEn:"China Helicopter Research and Development Institute (Institute 602) is a member unit under the Aviation Industry Corporation of China, founded in 1969 and located in Jingdezhen, Jiangxi. As China's only helicopter design institute, it has over 20 specialized laboratories and the capability to develop third- and fourth-generation helicopters, having successfully developed 12 series and over 60 military and civil helicopter and unmanned helicopter models, including the Z-8, Z-9, Z-11, Z-10, Z-19, Z-20, AC313, AC311, AC352 and AR-500. It has achieved rich results in technological innovation, pushed Chinese helicopter technology toward the advanced world level, played an important role in military-civil integration and international cooperation, and made a marked contribution to national defense and the national economy.",city:"景德镇",region:"华东",code:"602所",name:"中国直升机设计研究所",
    brief:"国内唯一的直升机设计研究所，具备研制第三代、第四代先进直升机的能力，成功研制直-8、直-10、直-20等12个系列60多种型号。",
    full:"中国直升机设计研究所（602所）是中国航空工业集团有限公司下属的成员单位，成立于1969年，位于江西省景德镇市。作为国内唯一的直升机设计研究所，该所拥有20多个专业研究室，具备研制第三代、第四代先进直升机的能力，并已成功研制包括直-8、直-9、直-11、直-10、直-19、直-20、AC313、AC311、AC352、AR-500等在内的12个系列60多种型号的军民用直升机及无人直升机。研究所在技术创新方面成果丰硕，推动中国直升机技术迈向世界先进水平，并在军民融合及国际合作方面发挥重要作用，为国防建设和国民经济建设作出了显著贡献。"},
  nj:{cityEn:"Nanjing",nameEn:"China Special Vehicle Research Institute",briefEn:"China's only lead institute for water-based aircraft, lighter-than-air craft and general aviation, having developed products such as China's first large seaplane.",fullEn:"China Special Vehicle Research Institute (code 605), under the Aviation Industry Corporation of China, is the nation's only lead institute for water-based aircraft, lighter-than-air craft and general aviation R&D. It was founded in 1961 in Nanjing and settled in Jingmen, Hubei in 1968. As a key national military-support unit, it has developed China's first large seaplane, first practical manned helium airship, first agricultural ultra-light aircraft, first ultra-light seaplane, first practical wing-in-ground-effect aircraft, first tethered balloon information platform and first-generation stratospheric airship test vehicle. It is currently developing the AG600 large firefighting and water-rescue amphibian, the HO300 light amphibian, the AG50 light sport aircraft and various lighter-than-air craft, and has won over 500 national, provincial and ministerial awards, filling many gaps in China's aviation high technology.",city:"南京",region:"华东",code:"605所",name:"中国特种飞行器研究所",
    brief:"我国唯一从事水面飞行器、浮空飞行器和通用飞机研发的主机研究所，先后研制了中国第一架大型水上飞机等航空产品。",
    full:"中国特种飞行器研究所（代号605），隶属于中国航空工业集团有限公司，是我国唯一从事水面飞行器、浮空飞行器和通用飞机研发的主机研究所。该研究所始建于1961年，在南京组建，1968年定点湖北荆门。作为国家重点保军单位，中国特种飞行器研究所拥有丰富的科研和技术成果，先后研制完成了中国第一架大型水上飞机、第一艘实用载人充氦飞艇、第一架农林用超轻型飞机、第一架超轻型水上飞机、第一架实用型地效飞机、第一艘系留气球信息平台、第一代平流层飞艇平台试验艇等航空产品。目前，研究所正在承研AG600大型灭火/水上救援水陆两栖飞机、HO300轻型水陆两栖飞机、AG50轻型运动飞机及多型浮空器系列产品。研究所先后获得国家及省部级科技成果五百余项，填补了中国航空高科技和基础研究领域的多项空白。"},
  ly:{cityEn:"Luoyang",nameEn:"AVIC Luoyang Electro-Optical Equipment Research Institute",briefEn:"Engaged in research and product development of airborne electro-optical systems and fire control systems, providing advanced fire control and electro-optical equipment for domestic fighters.",fullEn:"AVIC Luoyang Electro-Optical Equipment Research Institute (Institute 613) is a research institution under the Aviation Industry Corporation of China, located in Luoyang, Henan. It mainly researches and develops airborne electro-optical systems, fire control systems and other avionics specialties, providing advanced fire control and electro-optical equipment for several domestic fighter types. It is an important development base for China's airborne fire control systems.",city:"洛阳",region:"华中",code:"613所",name:"航空工业洛阳电光设备研究所",
    brief:"从事机载光电火控系统等专业的研究与产品研制，为国产战机提供先进的火控与光电装备。",
    full:"航空工业洛阳电光设备研究所（613所）是中国航空工业集团有限公司下属的研究机构，位于河南省洛阳市，主要从事机载光电系统、火力控制系统等航空电子专业的研究与产品研制，为多型国产战斗机提供了先进的火控与光电装备，是我国航空机载火力控制系统的重要研制基地。"},
  xy:{cityEn:"Xiangyang",nameEn:"AVIC Radar and Avionics Research Institute",briefEn:"Integrating airborne radar and avionics R&D, testing and manufacturing, covering integrated surveillance systems, airborne radar, cockpit displays and many other products.",fullEn:"AVIC Radar and Avionics Research Institute traces back to Institute 607, China Leihua Electronic Technology Research Institute, founded in March 1970. In March 2004, based on Institute 607 and Factory 171, AVIC Radar and Avionics Research Institute was formally established. It integrates airborne radar and avionics R&D, testing and manufacturing, serving both government and commercial systems, with products including integrated surveillance systems, airborne radar, cockpit displays, broadcast and TV network transmission equipment, C919 seat components and special sensor devices.",city:"襄阳",region:"华中",code:"607所",name:"航空工业雷达与电子设备研究院",
    brief:"集机载雷达和航空电子系统研发、试验、制造为一体，业务覆盖综合监视系统、机载雷达、座舱显示器等众多产品。",
    full:"航空工业雷达与电子设备研究院的前身可以追溯到607所，即中国雷华电子技术研究所，该研究所成立于1970年3月。2004年3月，基于607所和171厂的基础上，航空工业雷达与电子设备研究院正式挂牌成立。研究院集机载雷达和航空电子系统研发、试验、制造为一体，业务范围覆盖政府系统和商用系统两大领域，涉及综合监视系统、机载雷达、座舱显示器、广播电视网络传输设备、C919飞机座椅等部件的生产、专用传感器件等众多产品。"},
  tc:{cityEn:"Tongchuan",nameEn:"Aircraft Strength Research Institute of China",briefEn:"China's only aircraft strength research, verification and appraisal center, conducting ground strength verification from materials and elements to components and complete airframes.",fullEn:"Aircraft Strength Research Institute of China, under the Aviation Industry Corporation of China, is the nation's only aircraft strength research, verification and appraisal center. It carries out advance research in aircraft strength technology, provides theories, methods and tools for solving aviation strength problems, and undertakes ground strength verification tests from materials and elements to components and complete airframes, with the function of verifying and issuing appraisal conclusions for newly developed and modified aircraft on behalf of the state. It also provides technical services and products for aerospace, ordnance, rail transit, petroleum and wind power.",city:"铜川",region:"华中",code:"623所",name:"中国飞机强度研究所",
    brief:"我国唯一的飞机强度研究、验证与鉴定中心，承担从材料、元件、部件到整机结构的地面强度验证试验。",
    full:"中国飞机强度研究所（简称「强度所」）隶属于中国航空工业集团有限公司，是我国唯一的飞机强度研究、验证与鉴定中心。主要开展飞机强度技术领域的预先研究，提供解决航空强度问题的理论、方法、工具，承担从材料、元件、部件到整机结构的地面强度验证试验，具有代表国家对新研及改型飞机强度进行验证、并给出鉴定结论的职能。同时，也为航天、兵器、轨道交通、石油风电等领域提供技术服务和产品支持。"},
  xa:{cityEn:"Xi'an",nameEn:"AVIC First Aircraft Institute",briefEn:"Integrating the design of fighter-bombers, bombers, civil aircraft, transports and special aircraft, having developed over 30 models including the Y-7, KJ-1 and China Flying Leopard.",fullEn:"AVIC First Aircraft Institute, located in historic Xi'an, is a large and medium military-civil aircraft design institute integrating the design of fighter-bombers, bombers, civil aircraft, transports and special aircraft. It brings together Chinese Academy of Engineering academicians, national-level young experts and complete military-civil design teams. Passing through three stages — surveying and imitation, improvement and modification, and fully independent design — it has successfully developed over 30 models, including China's first regional airliner the Y-7, first airborne early warning aircraft the KJ-1, first-generation fighter-bomber the China Flying Leopard and the first light business jet the XY-500, setting four milestones in Chinese aviation history. Upholding the Flying Leopard spirit, it has built supporting research facilities and won over 300 national, provincial and ministerial awards. On September 3, 2022 its large solar UAV, the Qimingxing-50, made its maiden flight in Yulin, Shaanxi.",city:"西安",region:"西北",code:"一飞院",name:"航空工业第一飞机设计研究院",
    brief:"集歼击轰炸机、轰炸机、民用飞机、运输机和特种飞机设计研究于一体，成功研制运七、空警1号、「中国飞豹」等30多种飞机型号。",
    full:"中国航空工业集团公司第一飞机设计研究院，位于古城西安，是中国集歼击轰炸机、轰炸机、民用飞机、运输机和特种飞机等设计研究于一体的大中型军民用飞机设计研究院。该院汇聚了中国工程院院士、国家级有突出贡献的中青年专家以及完整的军民机设计团队。历经从测仿设计、改进改型到完全自行设计研制飞机的三个发展阶段，一飞院成功研制了包括我国第一代支线客机运七飞机、第一架空中预警机空警1号、第一代歼击轰炸机「中国飞豹」、第一架轻型公务机小鹰-500飞机在内的30多种飞机型号，树立了中国航空工业史上的四座里程碑。秉承「报国、拼搏、求实、创新、团队」的飞豹精神，一飞院建立了配套科研设施，取得了300多项国家、部省级科技成果。2022年9月3日，由一飞院研制的「启明星50」大型太阳能无人机在陕西榆林首飞成功。"},
  cd:{cityEn:"Chengdu",nameEn:"AVIC Chengdu Aircraft Design and Research Institute",briefEn:"An important base for modern Chinese fighter and UAV design, undertaking key national programs such as the J-7 series, J-10 series and J-20.",fullEn:"AVIC Chengdu Aircraft Design and Research Institute (Institute 611) is an important institution under the Aviation Industry Corporation of China, founded in 1970 and located in Chengdu, Sichuan. As an important base for modern Chinese fighter and UAV design, it mainly conducts aircraft design and comprehensive aerospace multidisciplinary research. It has undertaken key national programs and many preliminary projects, including the J-7 series, JF-17, J-10 series, J-20 and various UAV series. In advanced aerodynamics and stealth, flight control, avionics integration, stealth technology and virtual simulation its research is at the leading domestic and international level, with hundreds of specialties covering the whole design process; it has won the National Science and Technology Progress Special Prize and the China Quality Award.",city:"成都",region:"西南",code:"611所",name:"航空工业成都飞机设计研究所",
    brief:"我国现代化歼击机和无人机设计研究的重要基地，先后承担歼7系列、歼10系列、歼20战斗机等国家重点型号研制。",
    full:"航空工业成都飞机设计研究所（简称611所）是中国航空工业集团有限公司下属的重要飞机设计研究机构，成立于1970年，位于四川省成都市。作为我国现代化歼击机和无人机设计研究的重要基地，该研究所主要从事飞行器设计和航空航天多学科综合性研究。研究所先后承担了歼七系列战斗机、枭龙（JF-17）战斗机、歼10系列战斗机、歼20战斗机、各系列无人机等多个国家重点飞机型号研制和大量预研课题任务。在先进气动布局、飞行控制、航空电子综合、隐身技术、虚拟仿真等航空航天高技术领域，研究水平处于国内国际领先地位。成都飞机设计研究所设有总体气动隐身、结构强度、振动、飞行控制、航空电子、机电综合等数百个专业，研制流程覆盖飞机设计全过程，先后荣获国家科学技术进步特等奖、中国质量奖等奖项。"},
  gy:{cityEn:"Guiyang",nameEn:"AVIC Guizhou Guihang Aircraft Design and Research Institute",briefEn:"Guizhou's only aircraft R&D unit, having designed and developed the J-6 series, J-7II, JJ-7 series, Shanying series and Yaoying series.",fullEn:"AVIC Guizhou Guihang Aircraft Design and Research Institute, located in Anshun, Guizhou, was founded in 1968 and is under AVIC Guizhou Aircraft Co. It mainly designs, tests and conducts preliminary research on fighters, trainers and UAVs. As Guizhou's only aircraft R&D unit, it has a complete research system and a digital distributed collaborative design system, with over 30 specialties covering the whole design process. Since its founding it has designed and developed the J-6 series, J-7II, JJ-7 series, Shanying series and Yaoying series fighters, advanced trainers and UAVs, winning over 400 awards including the National Science Conference award and first prize of National Science and Technology Progress.",city:"贵阳",region:"西南",code:"贵飞所",name:"航空工业贵州贵航飞机设计研究所",
    brief:"贵州省唯一的飞机设计研发单位，设计研制了歼六系列、歼七Ⅱ、歼教七系列、「山鹰」系列和鹞鹰系列等多个型号。",
    full:"航空工业贵州贵航飞机设计研究所（简称贵飞所）位于贵州省安顺市，成立于1968年，隶属于中航贵州飞机有限责任公司。贵飞所主要从事歼击机、教练机和无人机的设计、试验和预研工作。作为贵州省唯一的飞机设计研发单位，贵飞所拥有完整的飞机科研体系和数字化异地协同飞机设计体系。贵飞所设有总体气动、结构强度、功能系统、航电综合、任务载荷等30多个专业，覆盖飞机设计全过程。建所以来，贵飞所秉承「航空报国、强军富民」的宗旨，设计研制了歼六系列、歼七Ⅱ、歼教七系列、「山鹰」系列和鹞鹰系列等多个型号的歼击机、高级教练机和无人机，共获得全国科学大会奖、国家科技进步一等奖等400余项奖项。"}

const SANXIAN_TEXT_EN="The Third Front was a large-scale program of national defense, science, industry and transport infrastructure, guided by war preparedness, that the state carried out in the central and western regions from 1964. Shenyang, with its strong heavy-industry base, took on arduous tasks. A large group of Tiexi workers went west: from 1950 to 1989, 48 Tiexi enterprises took part, sending 23,304 people in all, including 94 factory-level cadres, 7,000 middle-level cadres and 16,210 skilled workers. Three enterprises moved in full, 23 built new factories on a turnkey basis and 29 transferred entire workshops; 13,221 people were trained for others; 29 provinces, municipalities and autonomous regions, 121 cities and counties and 526 enterprises received aid. State-owned Shenyang Factory 410 (now AECC Shenyang Liming Aero-Engine Co.), following the Third Ministry of Machine Building and the three guarantees and one assurance principle — guarantee construction, relocation and production start while assuring higher output at the old factory — sent large numbers of cadres, technicians, workers and equipment from 1965 to 1969 to Base 011 in Guizhou and Base 012 in Hanzhong. As of 1969 it had sent 2,665 personnel, 118 machine tools and 12,598 sets of tools, fixtures, gauges and measuring tools. In October 1965 the Ministry of Transport asked Shenyang to send a motor squadron of 50 vehicles to Sichuan; from November it ran the 800-kilometer round-trip highway transport between Chengdu and Dukou. The Shenyang region sent nearly 20,000 leading cadres and technical support personnel nationwide, forming the one institute, one factory aviation layout across the Northeast, North, Northwest and Southwest.";

/* hash 深链：#/screen[/id[/tab]] */
function parseHash(){
  const h=location.hash.replace(/^#\/?/,"");
  if(!h||h==="cover")return null;
  const parts=h.split("/");
  const p={screen:parts[0]};
  if(parts[1])p.id=parts[1];
  if(parts[2])p.tab=parts[2];
  if(["cover","home","jichuang","gallery","machine","guohui","hangkong","fighter","hero","battle","map","institute","sanxian"].indexOf(p.screen)<0)return null;
  return p;
}
function syncHash(){
  const cur=hist[hist.length-1];
  let h="/"+cur.screen;
  if(cur.params.id)h+="/"+cur.params.id;
  if(cur.params.tab)h+="/"+cur.params.tab;
  if(location.hash!=="#"+h)history.replaceState(null,"","#"+h);
}
function initFromHash(){
  const p=parseHash();
  if(p){ hist=[{screen:"cover",params:{}}]; const pr={id:p.id,tab:p.tab}; go(p.screen,pr); }
}

function catOf(screen,params){
  if(screen==="jichuang"||screen==="gallery"||screen==="machine")return "jichuang";
  if(screen==="guohui")return "guohui";
  if(screen==="hangkong"||screen==="fighter"||screen==="hero"||screen==="map"||screen==="institute"||screen==="battle")return "hangkong";
  if(screen==="sanxian")return "sanxian";
  return null;
}

      "<div class='dinfo'>"+

        "<p class='para mt'>"+(LANG==="en"?"On May 1, 1951, New China's first metal national emblem was hung on Tiananmen Gate, a task assigned to Shenyang No.1 Machinery Factory (predecessor of Shenyang No.1 Machine Tool Works). Production had only just resumed, yet under crude conditions the workers successfully cast a high-precision emblem through innovation and effort. They brought in sand of different properties from Inner Mongolia and Dalian and mixed it to ensure a smooth surface. Through repeated trials they solved the casting problem caused by the different melting points of copper and aluminum; with no modern equipment they relied on handwork and experience. Working day and night, they fixed problems such as wheat grains that were not raised and awns that did not show, finally producing a qualified model. They judged temperature by watching the color of molten aluminum with the naked eye, stirred it with wooden rods for deoxidation and made their own iron pots in place of aluminum-melting vessels, a remarkable spirit of craftsmanship and striving.":"1951年5月1日，新中国第一枚金属国徽悬挂在天安门城楼上，这个任务交给了沈阳第一机器厂（沈阳第一机床厂前身）。当时沈阳第一机器厂刚恢复生产，在简陋的条件下，通过创新和努力，成功铸造了高精度的国徽。他们从内蒙古和大连运来不同特性的砂子混合使用，以保证国徽表面的光洁度。工人们通过反复试验，解决了铜铝合金熔点不同导致的浇铸难题；在没有现代化设备的情况下，依靠手工操作和经验，克服了重重困难。工人们日夜研究、反复实验，解决了模型图案上的麦穗粒不鼓、芒不显等问题，最终合格的国徽模型做出来了。他们用肉眼观察铝水颜色的变化来测试温度，用木棒搅拌脱氧，自制铁罐代替化铝罐，展现了极高的工匠精神和奋斗精神。")+"</p>"+

const SEARCH_IDX=buildSearchIndex();
function doSearch(q){
  const box=document.getElementById("searchDrop");
  if(!q.trim()){box.style.display="none";return;}
  const tokens=q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const en=LANG==="en";
  const tt=it=>en?(it.tEn||it.t):it.t, kk=it=>en?(it.kEn||it.k):it.k;
  const scored=[];
  SEARCH_IDX.forEach((it,ix)=>{
    const t0=tt(it), hay=(t0+" "+kk(it)).toLowerCase();
    if(tokens.every(tk=>hay.includes(tk))){
      let sc=tokens.reduce((s,tk)=>s+(t0.toLowerCase().startsWith(tk)?3:(hay.includes(tk)?1:0)),0);
      scored.push({it,ix,sc});
    }
  });
  scored.sort((a,b)=>b.sc-a.sc);
  const hits=scored.slice(0,9);
  if(!hits.length){
    box.innerHTML="<div style='padding:16px 18px;color:var(--grey);font-size:15px;line-height:2'>"+T("noresult1")+esc(q)+T("noresult2")+"<br><span style='color:#8b93a0;font-size:13px'>"+T("trywords")+"</span></div>";
  }else{
    box.innerHTML=hits.map(h=>{
      let t=esc(tt(h.it));
      tokens.forEach(tk=>{
        const rx=new RegExp("("+tk.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");
        t=t.replace(rx,"<b>$1</b>");
      });
      return "<div class='sd-item' onclick='pickSearch(this)' data-i='"+h.ix+"'><span>"+t+"</span><span class='sd-k'>"+esc(kk(h.it))+"</span></div>";
    }).join("");
  }
  box.style.display="block";
}
function pickSearch(el){
  SEARCH_IDX[+el.dataset.i].go();
  document.getElementById("searchDrop").style.display="none";
  document.getElementById("searchInput").value="";
}

  let i=FIGHTERS.findIndex(x=>x.id===id);
  if(i<0)i=0;
  i=(i+dir+FIGHTERS.length)%FIGHTERS.length;
  const tab=(cur.params&&cur.params.tab)||"info";
  replace("fighter",{id:FIGHTERS[i].id,tab:tab});
}
/* ===== 性能图表（依据 PDF 展陈稿数据，内联 SVG 离线渲染）===== */
function radarSVG(f){
  if(!f.radar)return "";
  const ax=f.radar.axes, mx=f.radar.max;
  const W=640,H=430,cx=320,cy=212,R=142;
  const ang=i=>(-90+i*60)*Math.PI/180;
  const pt=(i,r)=>{const a=ang(i);return [cx+r*Math.cos(a),cy+r*Math.sin(a)].map(v=>+v.toFixed(1));};
  let grid="",ring="";
  for(let k=1;k<=3;k++){
    const rr=R*k/3;
    let poly="";
    for(let i=0;i<6;i++)poly+=pt(i,rr).join(",")+(i<5?",":"");
    grid+='<polygon points="'+poly+'" fill="none" stroke="rgba(205,217,236,.18)" stroke-width="1"/>';
  }
  for(let i=0;i<6;i++)ring+='<line x1="'+cx+'" y1="'+cy+'" x2="'+pt(i,R)[0]+'" y2="'+pt(i,R)[1]+'" stroke="rgba(205,217,236,.18)" stroke-width="1"/>';
  let dat="";
  for(let i=0;i<6;i++){
    const rr=Math.max(8,R*(Math.min(ax[i][2]/mx[i],1)));
    dat+=pt(i,rr).join(",")+(i<5?",":"");
  }
  let labs="";
  for(let i=0;i<6;i++){
    const p=pt(i,R);
    const lx=p[0]>=cx+60?cx+R+46:(p[0]<=cx-60?cx-R-46:p[0]);
    const ly=p[1]>=cy+40?cy+R+26:(p[1]<=cy-40?cy-R-22:p[1]);
    labs+='<text x="'+lx+'" y="'+(ly+4)+'" fill="#ff8c33" font-size="15" font-weight="700" text-anchor="middle">'+(LANG==="en"?(AX_EN[ax[i][0]]||ax[i][0]):ax[i][0])+'</text>';
    labs+='<text x="'+lx+'" y="'+(ly+24)+'" fill="#e6edf7" font-size="13.5" text-anchor="middle">'+unitEn(ax[i][1])+'</text>';
  }
  return "<div class='radar-wrap'><svg viewBox='0 0 640 430' xmlns='http://www.w3.org/2000/svg'>"+
    "<defs><linearGradient id='rdg' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#ff8c33' stop-opacity='.55'/><stop offset='1' stop-color='#ff8c33' stop-opacity='.12'/></linearGradient></defs>"+
    grid+ring+
    "<polygon class='data-poly' points='"+dat+"' fill='url(#rdg)' stroke='#ff8c33' stroke-width='2.2'/>"+
    labs+
    "<circle cx='"+cx+"' cy='"+cy+"' r='3' fill='#ff8c33'/>"+
    "</svg></div>";
}
function thrustBarSVG(){
  const d=[["WP-5",37],["WP-6",39.9],["WP-13AII",65.9],["WS-10",132],["WS-10A",135.39]];
  const W=640,H=36*d.length+46,maxv=150;
  let s="";
  d.forEach((r,i)=>{
    const y=30+i*36, w=Math.max(8,(W-160)*r[1]/maxv);
    s+='<text x="0" y="'+(y+16)+'" fill="#cdd9ec" font-size="14.5">'+r[0]+'</text>';
    s+='<rect x="86" y="'+(y+4)+'" width="'+(W-160)+'" height="16" rx="4" fill="rgba(255,255,255,.06)"/>';
    s+='<rect class="bar-fill" x="86" y="'+(y+4)+'" width="'+w+'" height="16" rx="4" fill="#ff8c33" style="transform-origin:86px '+(y+12)+'px"/>';
    s+='<text x="'+(96+w)+'" y="'+(y+17)+'" fill="#fff" font-size="13.5" font-weight="700">'+r[1]+'kN</text>';
  });
  return "<div class='bar-wrap'><svg viewBox='0 0 640 "+H+"' xmlns='http://www.w3.org/2000/svg'>"+s+"</svg></div>";
}
function baseTableHTML(f){
  if(!f.base)return "";
  const rows=Object.keys(f.base).map(k=>{const kk=LANG==="en"?(BASEK_EN[k]||k):k;let vv=f.base[k];if(LANG==="en")vv=BASEV_EN[vv]||vv;return "<tr><td>"+kk+"</td><td>"+vv+"</td></tr>";}).join("");
  return "<table class='spec-table'><tbody>"+rows+"</tbody></table>";
}

/* ================= V6 动效系统 ================= */
const RM=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function countUp(el){
  const b=el.querySelector("b"); if(!b)return;
  const target=parseInt(b.textContent.replace(/[^0-9]/g,""),10);
  if(isNaN(target)||target<=1)return;
  const dur=1500,t0=performance.now();
  function step(t){
    const p=Math.min((t-t0)/dur,1), e=1-Math.pow(1-p,3);
    b.textContent=Math.round(target*e).toLocaleString("en-US");
    if(p<1)requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function initMotion(){
  const cards=document.querySelectorAll(
    ".home-card,.gt-card,.fg-card,.battle-item,.ins-card,.sx-stat,.mnode,.hero-mini");
  cards.forEach(el=>el.classList.add("rv"));
  const targets=document.querySelectorAll(".rv,.radar-wrap,.bar-wrap");
  if(RM){
    targets.forEach(el=>{el.classList.add("in");el.classList.add("go");});
    return;
  }
  const io=new IntersectionObserver((entries)=>{
    entries.forEach(en=>{
      if(!en.isIntersecting)return;
      const el=en.target;
      if(el.classList.contains("rv"))el.classList.add("in");
      if(el.classList.contains("radar-wrap")||el.classList.contains("bar-wrap"))el.classList.add("go");
      if(el.classList.contains("sx-stat"))countUp(el);
      io.unobserve(el);
    });
  },{threshold:.12});
  targets.forEach(el=>io.observe(el));
  // 兜底：3 秒后任何未揭示的卡片强制显现，防止内容不可见
  setTimeout(()=>{document.querySelectorAll(".rv:not(.in)").forEach(el=>el.classList.add("in"));
    document.querySelectorAll(".radar-wrap:not(.go),.bar-wrap:not(.go)").forEach(el=>el.classList.add("go"));},3000);
}
function initPreloader(){
  const pl=document.getElementById("preloader");
  function coverGo(){const c=document.getElementById("screen-cover");if(c)c.classList.add("go");}
  function finish(){
    coverGo();
    if(!pl)return;
    if(RM){pl.remove();return;}
    pl.style.transition="opacity .5s";pl.style.opacity="0";
    setTimeout(()=>pl.remove(),520);
  }
  if(RM){finish();return;}
  const bar=document.getElementById("plBar");
  const t0=performance.now(),DUR=2200;
  function step(t){
    const p=Math.min((t-t0)/DUR,1);
    if(bar)bar.style.width=(p*100)+"%";
    if(p<1)requestAnimationFrame(step);else finish();
  }
  requestAnimationFrame(step);
  const skip=document.getElementById("plSkip");
  if(skip)skip.onclick=()=>{if(bar)bar.style.width="100%";finish();};
}
